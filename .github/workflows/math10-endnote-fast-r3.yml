        },
        {
          "name": "Reuse locked dependency downloads",
          "uses": "actions/cache@v4",
          "with": {
            "path": "~/.cargo/registry\n~/.cargo/git",
            "key": "math10-endnote-downloads-v1-${{ runner.os }}-${{ runner.arch }}-1.93.1-${{ hashFiles('rhwp/Cargo.lock') }}"
          }
        },
        {
          "name": "Check actual compiler and old cache compatibility",
          "id": "preflight",
          "shell": "pwsh",
          "run": "python \"$env:RUNNER_TEMP/math10-r3-scripts/ci-run.py\" preflight"
        },
        {
          "name": "Restore compatible dependency and incremental objects",
          "id": "target",
          "uses": "actions/cache/restore@v4",
          "with": {
            "path": "${{ env.CARGO_TARGET_DIR }}",
            "key": "math10-endnote-o1inc-v3-${{ runner.os }}-${{ runner.arch }}-${{ env.MATH10_IMAGE_ID }}-msvc1931-${{ hashFiles('rhwp/Cargo.lock', 'rhwp/rust-toolchain.toml') }}-70a9e1e45952491f-${{ matrix.stage }}-${{ fromJSON(env.PAIR_JSON)[matrix.stage].commit }}-${{ github.run_id }}-${{ github.run_attempt }}",
            "restore-keys": "math10-endnote-o1inc-v3-${{ runner.os }}-${{ runner.arch }}-${{ env.MATH10_IMAGE_ID }}-msvc1931-${{ hashFiles('rhwp/Cargo.lock', 'rhwp/rust-toolchain.toml') }}-70a9e1e45952491f-${{ matrix.stage }}-\nmath10-endnote-o1inc-v3-${{ runner.os }}-${{ runner.arch }}-${{ env.MATH10_IMAGE_ID }}-msvc1931-${{ hashFiles('rhwp/Cargo.lock', 'rhwp/rust-toolchain.toml') }}-70a9e1e45952491f-\n${{ steps.preflight.outputs.old_restore_prefix }}"
          }
        },
        {
          "name": "Fresh compile, six actual cases, explicit native CLI build",
          "id": "verify",
          "shell": "pwsh",
          "env": {
            "CACHE_HIT": "${{ steps.target.outputs.cache-hit }}",
            "CACHE_MATCHED": "${{ steps.target.outputs.cache-matched-key }}",
            "CACHE_PRIMARY": "${{ steps.target.outputs.cache-primary-key }}"
          },
          "run": "python \"$env:RUNNER_TEMP/math10-r3-scripts/ci-run.py\" run"
        },
        {
          "name": "Save only successful target objects",
          "if": "success() && steps.verify.outcome == 'success'",
          "uses": "actions/cache/save@v4",
          "with": {
            "path": "${{ env.CARGO_TARGET_DIR }}",
            "key": "${{ steps.target.outputs.cache-primary-key }}"
          }
        },
        {
          "name": "Always upload source, compiler, failures and receipts",
          "if": "always()",
          "uses": "actions/upload-artifact@v4",
          "with": {
            "name": "math10-endnote-r3-o1-${{ matrix.stage }}-evidence-${{ github.run_id }}-${{ github.run_attempt }}",
            "path": "${{ runner.temp }}/math10-r3-${{ matrix.stage }}/evidence\n${{ runner.temp }}/math10-r3-scripts",
            "include-hidden-files": true,
            "if-no-files-found": "warn"
          }
        },
        {
          "name": "Upload stage pair pending both-stage acceptance",
          "if": "success() && steps.verify.outcome == 'success'",
          "uses": "actions/upload-artifact@v4",
          "with": {
            "name": "math10-endnote-r3-o1-${{ matrix.stage }}-native-${{ github.run_id }}-${{ github.run_attempt }}",
            "path": "${{ runner.temp }}/math10-r3-${{ matrix.stage }}/pair",
            "if-no-files-found": "error"
          }
        }
      ]
    }
  }
