        "PAIR_STAGE": "${{ matrix.stage }}",
        "CARGO_TARGET_DIR": "${{ github.workspace }}/rhwp/target"
      },
      "steps": [
        {
          "name": "Seed owned scripts before clean source checkout",
          "shell": "python",
          "run": "import base64, os\nfrom pathlib import Path\np=Path(os.environ[\"RUNNER_TEMP\"])/\"math10-r3-scripts\"\np.mkdir(exist_ok=False)\n(p/'contract.py').write_bytes(base64.b64decode(''))\n(p/'ci-run.py').write_bytes(base64.b64decode(''))\n(p/'ci-supervisor.py').write_bytes(base64.b64decode(''))\nimport runpy\nowned=runpy.run_path(str(p/\"ci-supervisor.py\"))[\"owned\"]\nfor key,value in [(\"core.autocrlf\",\"false\"),(\"core.eol\",\"lf\")]:\n    result=owned([\"git\",\"config\",\"--global\",key,value],\".\",60,p/(key+\".log\"))\n    assert result[\"exit_code\"]==0,result\nwith open(os.environ[\"GITHUB_ENV\"],\"a\",encoding=\"utf-8\") as f:\n    f.write(\"MATH10_IMAGE_ID=\"+os.environ[\"ImageOS\"]+\"-\"+os.environ[\"ImageVersion\"]+\"\\n\")\n"
        },
