    "CARGO_BUILD_JOBS": "1",
    "CARGO_TERM_COLOR": "never",
    "RUN_URL": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
  },
  "jobs": {
    "regression": {
      "runs-on": "windows-2025",
      "timeout-minutes": 65,
      "strategy": {
        "fail-fast": false,
        "matrix": {
          "stage": [
            "before",
            "after"
          ]
        }
      },
      "env": {
        "PAIR_STAGE": "${{ matrix.stage }}",
        "CARGO_TARGET_DIR": "${{ github.workspace }}/rhwp/target"
      },
      "steps": [
        {
          "name": "Seed scripts and disable autocrlf before source checkout",
          "shell": "python",
          "run": "import base64, os\nfrom pathlib import Path\np=Path(os.environ[\"RUNNER_TEMP\"])/\"math10-fast-scripts\"\np.mkdir(exist_ok=True)\n(p/'ci-run.py').write_bytes(base64.b64decode(''))\n(p/'ci-supervisor.py').write_bytes(base64.b64decode(''))\nimport runpy\nowned=runpy.run_path(str(p/\"ci-supervisor.py\"))[\"owned\"]\nfor key,value in [(\"core.autocrlf\",\"false\"),(\"core.eol\",\"lf\")]:\n    result=owned([\"git\",\"config\",\"--global\",key,value],\".\",60,p/(key+\".log\"))\n    assert result[\"exit_code\"]==0,result\nwith open(os.environ[\"GITHUB_ENV\"],\"a\",encoding=\"utf-8\") as f:\n    f.write(\"MATH10_IMAGE_ID=\"+os.environ[\"ImageOS\"]+\"-\"+os.environ[\"ImageVersion\"]+\"\\n\")\n"
        },
        {
          "uses": "actions/checkout@v4",
          "with": {
            "ref": "${{ fromJSON(env.PAIR_JSON)[matrix.stage].commit }}",
            "fetch-depth": 0
          }
        },
        {
          "uses": "dtolnay/rust-toolchain@1.93.1",
          "with": {
            "targets": "x86_64-pc-windows-msvc"
          }
        },
        {
          "name": "Reuse locked dependency downloads only",
          "uses": "actions/cache@v4",
          "with": {
            "path": "~/.cargo/registry\n~/.cargo/git",
            "key": "math10-endnote-downloads-v1-${{ runner.os }}-${{ runner.arch }}-1.93.1-${{ hashFiles('rhwp/Cargo.lock') }}",
            "restore-keys": "cargo-v2-${{ runner.os }}-${{ runner.arch }}-1.93.1-math10-native-r18-"
          }
        },
        {
          "name": "Restore only compatible O1 incremental target cache",
          "id": "target",
          "uses": "actions/cache/restore@v4",
          "with": {
            "path": "${{ env.CARGO_TARGET_DIR }}",
            "key": "math10-endnote-o1inc-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.MATH10_IMAGE_ID }}-msvc1931-${{ hashFiles('rhwp/Cargo.lock', 'rhwp/rust-toolchain.toml') }}-8e81e69cc50b3738-${{ matrix.stage }}-${{ fromJSON(env.PAIR_JSON)[matrix.stage].commit }}-${{ github.run_id }}-${{ github.run_attempt }}",
            "restore-keys": "math10-endnote-o1inc-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.MATH10_IMAGE_ID }}-msvc1931-${{ hashFiles('rhwp/Cargo.lock', 'rhwp/rust-toolchain.toml') }}-8e81e69cc50b3738-${{ matrix.stage }}-\nmath10-endnote-o1inc-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.MATH10_IMAGE_ID }}-msvc1931-${{ hashFiles('rhwp/Cargo.lock', 'rhwp/rust-toolchain.toml') }}-8e81e69cc50b3738-"
          }
        },
        {
          "name": "Compile owned target, prove behavior, build native CLI",
          "id": "verify",
          "shell": "pwsh",
          "env": {
            "CACHE_HIT": "${{ steps.target.outputs.cache-hit }}",
            "CACHE_MATCHED": "${{ steps.target.outputs.cache-matched-key }}",
            "CACHE_PRIMARY": "${{ steps.target.outputs.cache-primary-key }}"
          },
          "run": "python \"$env:RUNNER_TEMP/math10-fast-scripts/ci-run.py\""
        },
        {
          "name": "Save successful O1 incremental objects for future iterations",
          "if": "success() && steps.verify.outcome == 'success'",
          "uses": "actions/cache/save@v4",
          "with": {
            "path": "${{ env.CARGO_TARGET_DIR }}",
            "key": "${{ steps.target.outputs.cache-primary-key }}"
          }
        },
        {
          "name": "Always upload exact failure and execution receipts",
          "if": "always()",
          "uses": "actions/upload-artifact@v4",
          "with": {
            "name": "math10-endnote-o1-${{ matrix.stage }}-evidence-${{ github.run_id }}-${{ github.run_attempt }}",
            "path": "${{ runner.temp }}/math10-fast-${{ matrix.stage }}/evidence",
            "if-no-files-found": "warn"
          }
        },
        {
          "name": "Upload successful source-bound native pair",
          "if": "success() && steps.verify.outcome == 'success'",
          "uses": "actions/upload-artifact@v4",
          "with": {
            "name": "math10-endnote-o1-${{ matrix.stage }}-native-${{ github.run_id }}-${{ github.run_attempt }}",
            "path": "${{ runner.temp }}/math10-fast-${{ matrix.stage }}/pair",
            "if-no-files-found": "error"
          }
        }
      ]
    }
  }
}
