{
  "name": "Private math10 generic repaired paired O1 v8",
  "on": {
    "push": {
      "branches": [
        "ci/math10-repaired-pair-o1-v8-*"
      ]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "math10-repaired-pair-o1-v8-${{ github.ref }}",
    "cancel-in-progress": false
  },
  "env": {
    "PAIR_JSON": "{\"before\":{\"commit\":\"0f246d0f2262ba531657e6ad96a931c798a2c3fa\"},\"after\":{\"commit\":\"904784c474800094badb791b23460ccdc2e66d8c\"}}",
    "PAIR_FILE_SHA256": "3877aec5b7ae6ebf2a8c388528af091e62a730c0d7cec9a02cf56913d8b2154b",
    "CARGO_BUILD_JOBS": "1",
    "CARGO_TERM_COLOR": "never",
    "RUN_URL": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
  },
  "jobs": {
    "regression": {
      "runs-on": "windows-2025",
      "timeout-minutes": 65,
      "strategy": {
        "fail-fast": false,
        "matrix": {
          "stage": [
            "before",
            "after"
          ]
        }
      },
      "env": {
        "PAIR_STAGE": "${{ matrix.stage }}",
        "CARGO_TARGET_DIR": "${{ github.workspace }}/rhwp/target"
      },
      "steps": [
        {
          "name": "Select exact compatible CPython before any script or owner checks",
          "id": "python",
          "uses": "actions/setup-python@v5",
          "with": {
            "python-version": "3.13.16",
            "architecture": "x64",
            "check-latest": false,
            "allow-prereleases": false
          }
        },
        {
          "name": "Verify and record selected Python runtime identity",
          "shell": "pwsh",
          "env": {
            "MATH10_SELECTED_PYTHON": "${{ steps.python.outputs.python-path }}",
            "MATH10_SELECTED_PYTHON_VERSION": "${{ steps.python.outputs.python-version }}",
            "MATH10_PYTHON_RUNTIME_FILE": "${{ runner.temp }}/math10-r3v8-python-runtime.json"
          },
          "run": "if (-not $env:MATH10_SELECTED_PYTHON -or -not $env:MATH10_SELECTED_PYTHON_VERSION -or -not (Test-Path -LiteralPath $env:MATH10_SELECTED_PYTHON -PathType Leaf)) { throw \"PYTHON_SELECTION_BLOCKED: exact setup-python interpreter is missing; no ambient fallback\" }\n& \"$env:MATH10_SELECTED_PYTHON\" -X utf8 -B -c @'\nimport os, json\nfrom pathlib import Path\nPYTHON_VERSION='3.13.16'\ndef python_runtime():\n    \"\"\"Check the action-selected runtime before transport, snapshots or owner loading.\"\"\"\n    import platform\n    import struct\n    import sys\n    selected = os.environ.get('MATH10_SELECTED_PYTHON', '')\n    selected_version = os.environ.get('MATH10_SELECTED_PYTHON_VERSION', '')\n    if not selected or not selected_version:\n        raise RuntimeError('PYTHON_SELECTION_BLOCKED: setup-python selection outputs are missing')\n    actual_version = '.'.join(map(str, sys.version_info[:3]))\n    if (actual_version != PYTHON_VERSION or selected_version != PYTHON_VERSION or\n            sys.version_info.releaselevel != 'final' or sys.implementation.name != 'cpython' or\n            os.name != 'nt' or struct.calcsize('P') != 8):\n        raise RuntimeError('PYTHON_SELECTION_BLOCKED: exact Windows x64 CPython ' +\n                           PYTHON_VERSION + ' required; actual=' + sys.version +\n                           '; selected=' + selected_version)\n    actual_path = os.path.normcase(str(Path(sys.executable).resolve()))\n    selected_path = os.path.normcase(str(Path(selected).resolve()))\n    if actual_path != selected_path:\n        raise RuntimeError('PYTHON_SELECTION_BLOCKED: running executable differs from setup-python output')\n    return dict(version=actual_version, full_version=sys.version, implementation=sys.implementation.name,\n                cache_tag=sys.implementation.cache_tag, platform=sys.platform,\n                pointer_bits=struct.calcsize('P') * 8, executable=actual_path,\n                selected_executable=selected_path, selected_version=selected_version,\n                python_build=list(platform.python_build()))\npython_identity=python_runtime()\nrecord=Path(os.environ[\"MATH10_PYTHON_RUNTIME_FILE\"])\nassert record.resolve()==(Path(os.environ[\"RUNNER_TEMP\"])/\"math10-r3v8-python-runtime.json\").resolve()\nwith record.open(\"x\",encoding=\"utf-8\") as stream:\n    stream.write(json.dumps(python_identity,sort_keys=True,indent=2)+\"\\n\")\nprint(json.dumps(python_identity,sort_keys=True))\n'@\nif ($LASTEXITCODE -ne 0) { throw \"PYTHON_SELECTION_BLOCKED: exact interpreter verification failed\" }\n"
        },
