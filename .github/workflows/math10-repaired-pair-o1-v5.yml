{
  "name": "Private math10 generic repaired paired O1 v5",
  "on": {
    "push": {
      "branches": [
        "ci/math10-repaired-pair-o1-v5-*"
      ]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "math10-repaired-pair-o1-v5-${{ github.ref }}",
    "cancel-in-progress": false
  },
  "env": {
    "PAIR_JSON": "{\"before\":{\"commit\":\"8f1d4905042001b0ff76dd01cb8bea6825f23eab\"},\"after\":{\"commit\":\"c055affdf20db423e1256dd60d4a0d2326784ac4\"}}",
    "PAIR_FILE_SHA256": "45792c40d80df26e449602eadefd37043afbb3ab078bf9e1204da7e92786804c",
    "CARGO_BUILD_JOBS": "1",
    "CARGO_TERM_COLOR": "never",
    "RUN_URL": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
  },
  "jobs": {
    "regression": {
      "runs-on": "windows-2025",
      "timeout-minutes": 65,
      "strategy": {
        "fail-fast": false,
        "matrix": {
          "stage": [
            "before",
            "after"
          ]
        }
      },
      "env": {
        "PAIR_STAGE": "${{ matrix.stage }}",
        "CARGO_TARGET_DIR": "${{ github.workspace }}/rhwp/target"
      },
      "steps": [
        {
          "name": "Initialize sealed transport",
          "shell": "python",
          "run": "import base64, hashlib, os\nfrom pathlib import Path\np=Path(os.environ[\"RUNNER_TEMP\"])/\"math10-r3v5-scripts\"\np.mkdir(exist_ok=False)\n"
        },
        {
          "name": "Transport contract.py byte 0",
          "shell": "python",
          "run": "import base64, hashlib, os\nfrom pathlib import Path\np=Path(os.environ[\"RUNNER_TEMP\"])/\"math10-r3v5-scripts\"\nq=p/'contract.py.part'\nassert not (p/'contract.py').exists()\nassert not q.exists()\nb=base64.b64decode('', validate=True)\nassert len(b)==8400 and hashlib.sha256(b).hexdigest()=='dc85cebec960f581487381e5aadf60fb28ba3447bf06e16ecb63f9dd0191ce60'\nwith q.open('xb') as f:\n    assert f.write(b)==len(b)\n"
        },
        {
          "name": "Transport contract.py byte 8400",
          "shell": "python",
