    "cancel-in-progress": false
  },
  "env": {
    "PAIR_JSON": "{\"before\":{\"commit\":\"a363c2c33c6369f2b04c47a639dae66fc920f1b9\"},\"after\":{\"commit\":\"e730f3d8ea5440e397294b835bc15626e6c86540\"}}",
