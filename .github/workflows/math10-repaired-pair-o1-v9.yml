    "CARGO_BUILD_JOBS": "1",
    "CARGO_TERM_COLOR": "never",
    "RUN_URL": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
  },
  "jobs": {
    "regression": {
      "runs-on": "windows-2025",
      "timeout-minutes": 65,
