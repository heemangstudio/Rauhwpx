, selected_version=selected_version,\n                python_build=list(platform.python_build()))\npython_identity=python_runtime()\nrecord=Path(os.environ[\"MATH10_PYTHON_RUNTIME_FILE\"])\nassert record.resolve()==(Path(os.environ[\"RUNNER_TEMP\"])/\"math10-r3v9-python-runtime.json\").resolve()\nwith record.open(\"x\",encoding=\"utf-8\") as stream:\n    stream.write(json.dumps(python_identity,sort_keys=True,indent=2)+\"\\n\")\nprint(json.dumps(python_identity,sort_keys=True))\n'@\nif ($LASTEXITCODE -ne 0) { throw \"PYTHON_SELECTION_BLOCKED: exact interpreter verification failed\" }\n"
