          "run": "import os, json\nfrom pathlib import Path\nPYTHON_VERSION='3.13.16'\ndef python_runtime():\n    \"\"\"Check the action-selected runtime before transport, snapshots or owner loading.\"\"\"\n    import platform\n    import struct\n    import sys\n    selected = os.environ.get('MATH10_SELECTED_PYTHON', '')\n    selected_version = os.environ.get('MATH10_SELECTED_PYTHON_VERSION', '')\n    if not selected or not selected_version:\n        raise RuntimeError('PYTHON_SELECTION_BLOCKED: setup-python selection outputs are missing')\n    actual_version = '.'.join(map(str, sys.version_info[:3]))\n    if (actual_version != PYTHON_VERSION or selected_version != PYTHON_VERSION or\n            sys.version_info.releaselevel != 'final' or sys.implementation.name != 'cpython' or\n            os.name != 'nt' or struct.calcsize('P') != 8):\n        raise RuntimeError('PYTHON_SELECTION_BLOCKED: exact Windows x64 CPython ' +\n                           PYTHON_VERSION + ' required; actual=' + sys.version +\n                           '; selected=' + selected_version)\n    actual_path = os.path.normcase(str(Path(sys.executable).resolve()))\n    selected_path = os.path.normcase(str(Path(selected).resolve()))\n    if actual_path != selected_path:\n        raise RuntimeError('PYTHON_SELECTION_BLOCKED: running executable differs from setup-python output')\n    return dict(version=actual_version, full_version=sys.version, implementation=sys.implementation.name,\n                cache_tag=sys.implementation.cache_tag, platform=sys.platform,\n                pointer_bits=struct.calcsize('P') * 8, executable=actual_path,\n                selected_executable=selected_path, selected_version=selected_version,\n                python_build=list(platform.python_build()))\ndef selected_python_runtime():\n    \"\"\"Recheck the same selection and compare the early workflow identity record.\"\"\"\n    current = python_runtime()\n    record_name = os.environ.get('MATH10_PYTHON_RUNTIME_FILE', '')\n    if not record_name:\n        raise RuntimeError('PYTHON_SELECTION_BLOCKED: early runtime identity record is missing')\n    record = Path(record_name)\n    expected = Path(os.environ['RUNNER_TEMP']) / 'math10-r3v7-python-runtime.json'\n    if record.resolve() != expected.resolve() or not record.is_file():\n        raise RuntimeError('PYTHON_SELECTION_BLOCKED: early runtime identity record is missing or misplaced')\n    if json.loads(record.read_bytes()) != current:\n        raise RuntimeError('PYTHON_SELECTION_BLOCKED: runtime identity changed after interpreter selection')\n    return current\npython_identity=selected_python_runtime()\nimport os, hashlib\nfrom pathlib import Path\np=Path(os.environ[\"RUNNER_TEMP\"])/\"math10-r3v7-scripts\"\nexpected={'contract.py': '61a1effd8debef8bf01be0faacfbd91928f6e5a5ba4438045f8c0ecd12860aed', 'ci-run.py': '58d0645d69fad759dede3d9bf1adfe7a36643f42cc76a62e7cc48e0c5fd40f13', 'ci-supervisor.py': '28030d915b4eff41cad8a4cbffa5399801335dd5909c974a8fc9a077863bf9d3', 'pair.json': 'f35787b58e187bb8ddce6bdfe0c5a8d6ee4e2fa9a9245e669f56d5a8936fd15e'}\nfor name,digest in expected.items():\n    assert hashlib.sha256((p/name).read_bytes()).hexdigest()==digest\nimport runpy\nowned=runpy.run_path(str(p/\"ci-supervisor.py\"))[\"owned\"]\nfor key,value in [(\"core.autocrlf\",\"false\"),(\"core.eol\",\"lf\")]:\n    result=owned([\"git\",\"config\",\"--global\",key,value],\".\",60,p/(key+\".log\"))\n    assert result[\"exit_code\"]==0,result\nwith open(os.environ[\"GITHUB_ENV\"],\"a\",encoding=\"utf-8\") as f:\n    f.write(\"MATH10_IMAGE_ID=\"+os.environ[\"ImageOS\"]+\"-\"+os.environ[\"ImageVersion\"]+\"\\n\")\n    f.write(\"PAIR_FILE=\"+str(p/\"pair.json\")+\"\\n\")\n"
        },
        {
          "uses": "actions/checkout@v4",
          "with": {
            "ref": "${{ fromJSON(env.PAIR_JSON)[matrix.stage].commit }}",
            "fetch-depth": 0
          }
        },
        {
          "uses": "dtolnay/rust-toolchain@1.93.1",
          "with": {
            "targets": "x86_64-pc-windows-msvc"
          }
        },
        {
          "name": "Reuse locked dependency downloads",
          "uses": "actions/cache@v4",
          "with": {
            "path": "~/.cargo/registry\n~/.cargo/git",
            "key": "math10-endnote-downloads-v1-${{ runner.os }}-${{ runner.arch }}-1.93.1-${{ hashFiles('rhwp/Cargo.lock') }}"
          }
        },
        {
          "name": "Check actual compiler and old cache compatibility",
          "id": "preflight",
          "shell": "pwsh",
          "env": {
            "MATH10_SELECTED_PYTHON": "${{ steps.python.outputs.python-path }}",
            "MATH10_SELECTED_PYTHON_VERSION": "${{ steps.python.outputs.python-version }}",
            "MATH10_PYTHON_RUNTIME_FILE": "${{ runner.temp }}/math10-r3v7-python-runtime.json"
          },
          "run": "& \"$env:MATH10_SELECTED_PYTHON\" -X utf8 -B \"$env:RUNNER_TEMP/math10-r3v7-scripts/ci-run.py\" preflight\nif ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }"
        },
        {
          "name": "Restore compatible dependency and incremental objects",
          "id": "target",
          "uses": "actions/cache/restore@v4",
          "with": {
            "path": "${{ env.CARGO_TARGET_DIR }}",
            "key": "math10-endnote-o1inc-v7-${{ runner.os }}-${{ runner.arch }}-${{ env.MATH10_IMAGE_ID }}-msvc1931-${{ hashFiles('rhwp/Cargo.lock', 'rhwp/rust-toolchain.toml') }}-fc3fbef3b89e206d-${{ matrix.stage }}-${{ fromJSON(env.PAIR_JSON)[matrix.stage].commit }}-${{ github.run_id }}-${{ github.run_attempt }}",
            "restore-keys": "math10-endnote-o1inc-v7-${{ runner.os }}-${{ runner.arch }}-${{ env.MATH10_IMAGE_ID }}-msvc1931-${{ hashFiles('rhwp/Cargo.lock', 'rhwp/rust-toolchain.toml') }}-fc3fbef3b89e206d-${{ matrix.stage }}-\nmath10-endnote-o1inc-v7-${{ runner.os }}-${{ runner.arch }}-${{ env.MATH10_IMAGE_ID }}-msvc1931-${{ hashFiles('rhwp/Cargo.lock', 'rhwp/rust-toolchain.toml') }}-fc3fbef3b89e206d-\n${{ steps.preflight.outputs.old_restore_prefix }}"
          }
        },
        {
          "name": "Fresh compile, all bound actual cases, explicit native CLI build",
          "id": "verify",
          "shell": "pwsh",
          "env": {
            "MATH10_SELECTED_PYTHON": "${{ steps.python.outputs.python-path }}",
            "MATH10_SELECTED_PYTHON_VERSION": "${{ steps.python.outputs.python-version }}",
            "MATH10_PYTHON_RUNTIME_FILE": "${{ runner.temp }}/math10-r3v7-python-runtime.json",
            "CACHE_HIT": "${{ steps.target.outputs.cache-hit }}",
            "CACHE_MATCHED": "${{ steps.target.outputs.cache-matched-key }}",
            "CACHE_PRIMARY": "${{ steps.target.outputs.cache-primary-key }}"
          },
          "run": "& \"$env:MATH10_SELECTED_PYTHON\" -X utf8 -B \"$env:RUNNER_TEMP/math10-r3v7-scripts/ci-run.py\" run\nif ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }"
        },
        {
          "name": "Save only successful target objects",
          "if": "success() && steps.verify.outcome == 'success'",
          "uses": "actions/cache/save@v4",
          "with": {
            "path": "${{ env.CARGO_TARGET_DIR }}",
            "key": "${{ steps.target.outputs.cache-primary-key }}"
          }
        },
        {
          "name": "Always upload source, compiler, failures and receipts",
          "if": "always()",
          "uses": "actions/upload-artifact@v4",
          "with": {
            "name": "math10-repaired-v7-o1-${{ matrix.stage }}-evidence-${{ github.run_id }}-${{ github.run_attempt }}",
            "path": "${{ runner.temp }}/math10-r3v7-${{ matrix.stage }}/evidence\n${{ runner.temp }}/math10-r3v7-scripts\n${{ runner.temp }}/math10-r3v7-python-runtime.json",
            "include-hidden-files": true,
            "if-no-files-found": "warn"
          }
        },
        {
          "name": "Upload stage pair pending both-stage acceptance",
          "if": "success() && steps.verify.outcome == 'success'",
          "uses": "actions/upload-artifact@v4",
          "with": {
            "name": "math10-repaired-v7-o1-${{ matrix.stage }}-native-${{ github.run_id }}-${{ github.run_attempt }}",
            "path": "${{ runner.temp }}/math10-r3v7-${{ matrix.stage }}/pair",
            "if-no-files-found": "error"
          }
        }
      ]
    }
  }
