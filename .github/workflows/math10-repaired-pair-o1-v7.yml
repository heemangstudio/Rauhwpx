, '')\n    if not record_name:\n        raise RuntimeError('PYTHON_SELECTION_BLOCKED: early runtime identity record is missing')\n    record = Path(record_name)\n    expected = Path(os.environ['RUNNER_TEMP']) / 'math10-r3v7-python-runtime.json'\n    if record.resolve() != expected.resolve() or not record.is_file():\n        raise RuntimeError('PYTHON_SELECTION_BLOCKED: early runtime identity record is missing or misplaced')\n    if json.loads(record.read_bytes()) != current:\n        raise RuntimeError('PYTHON_SELECTION_BLOCKED: runtime identity changed after interpreter selection')\n    return current\npython_identity=selected_python_runtime()\nimport base64, hashlib, os\nfrom pathlib import Path\np=Path(os.environ[\"RUNNER_TEMP\"])/\"math10-r3v7-scripts\"\np.mkdir(exist_ok=False)\n",
