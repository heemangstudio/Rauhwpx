name: Release desktop apps

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Verify release tag
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.23.3

      - name: Require a version tag matching package.json
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          expected="v$(jq -r .version package.json)"
          if [ "${RELEASE_TAG}" != "${expected}" ]; then
            echo "Tag ${RELEASE_TAG} does not match package version ${expected#v}." >&2
            exit 1
          fi

      - name: Audit high and critical production advisories
        run: node scripts/audit-production.mjs

  verification:
    name: Verify release contracts
    needs: preflight
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.23.3
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install release tooling dependencies
        run: npm ci

      # The pull request verifies application behavior. The release additionally
      # checks its packaging contracts; desktop jobs verify built assets.
      - name: Check release tooling and packaging contracts
        run: npm run test:ci

      - name: Check published documentation
        run: npm run check:docs

  wasm:
    name: Build WASM engine
    # WASM is platform independent. Building it once keeps every installer on the
    # same engine and avoids the Windows Binaryen crash in wasm-opt.
    needs: preflight
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22.23.3
      - uses: ./.github/actions/build-wasm
      - name: Share release WASM build
        uses: actions/upload-artifact@v4
        with:
          name: release-wasm
          path: rhwp/pkg
          if-no-files-found: error
          retention-days: 7

  macos:
    name: Build macOS installers
    # Package while tagged-source verification runs.
    needs: [preflight, wasm]
    runs-on: blacksmith-6vcpu-macos-15
    timeout-minutes: 120
    environment: macos-release
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: ./.github/actions/package-desktop
        with:
          platform: macos
          artifact: macos-dist
          wasm-artifact: release-wasm
          signed: 'true'
          certificate: ${{ secrets.MACOS_CERTIFICATE }}
          certificate-password: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          apple-id: ${{ secrets.APPLE_ID }}
          apple-team-id: ${{ secrets.APPLE_TEAM_ID }}
          apple-password: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}

  windows:
    name: Build Windows installers
    needs: [preflight, wasm]
    runs-on: blacksmith-4vcpu-windows-2025
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: ./.github/actions/package-desktop
        with:
          platform: windows
          artifact: windows-dist
          wasm-artifact: release-wasm

  linux:
    name: Build Linux installers (${{ matrix.arch }})
    needs: [preflight, wasm]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: blacksmith-4vcpu-ubuntu-2404
            arch: x64
          - runner: blacksmith-4vcpu-ubuntu-2404-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.23.3
          cache: npm
          cache-dependency-path: |
            package-lock.json
            rhwp/rhwp-studio/package-lock.json
            rhwp/rhwp-agent/package-lock.json

      - uses: ./.github/actions/setup-rust
        with:
          wasm: 'true'
          cache: package

      - name: Install desktop dependencies
        run: |
          npm ci
          npm --prefix rhwp/rhwp-studio ci
          npm --prefix rhwp/rhwp-agent ci --omit=dev

      - name: Build native reference extractor
        run: npm run build:native

      - uses: ./.github/actions/build-wasm
        with:
          setup-rust: 'false'
          artifact: release-wasm

      - name: Build Studio application
        run: npm run build:studio:app

      - name: Build AppImage and Debian package
        run: npm run package:linux:${{ matrix.arch }}

      - name: Verify Linux artifacts
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          if [ "${EXPECTED_ARCH}" = arm64 ]; then
            test -f release/Rauhwpx-*-arm64.AppImage
            test -f release/Rauhwpx-*-arm64.deb
            test -f release/latest-linux-arm64.yml
          else
            test -f release/Rauhwpx-*-x86_64.AppImage
            test -f release/Rauhwpx-*-amd64.deb
            test -f release/latest-linux.yml
          fi

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-dist-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            release/*.AppImage
            release/*.deb
            release/latest-linux*.yml

  publish:
    name: Publish GitHub Release
    needs: [verification, macos, windows, linux]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Generate checksums
        run: |
          set -euo pipefail
          shopt -s nullglob
          cd release
          checksum_inputs=(./*.dmg ./*.zip ./*.exe ./*.AppImage ./*.deb)
          if [ "${#checksum_inputs[@]}" -eq 0 ]; then
            echo "No release artifacts were downloaded" >&2
            exit 1
          fi
          sha256sum "${checksum_inputs[@]}" > SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          artifacts=(
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.blockmap
            release/latest*.yml
            release/SHA256SUMS.txt
          )
          gh release create "${GITHUB_REF_NAME}" \
            "${artifacts[@]}" \
            --verify-tag \
            --generate-notes \
            --title "Rauhwpx ${GITHUB_REF_NAME}"
