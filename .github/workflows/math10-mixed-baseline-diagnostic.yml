{
  "name": "BASELINE ONLY mixed endnote table diagnostic",
  "on": {
    "push": {
      "branches": [
        "ci/math10-mixed-baseline-*"
      ]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "math10-mixed-baseline-${{ github.ref }}",
    "cancel-in-progress": false
  },
  "env": {
    "CARGO_BUILD_JOBS": "1",
    "CARGO_TARGET_DIR": "${{ github.workspace }}/rhwp/target"
  },
  "jobs": {
    "baseline": {
      "runs-on": "windows-2025",
      "timeout-minutes": 42,
      "steps": [
        {
          "name": "Create owned diagnostic tools directory",
          "shell": "python",
          "run": "import base64,os,pathlib\np=pathlib.Path(os.environ[\"RUNNER_TEMP\"])/\"mixed-diagnostic-tools\"\np.mkdir(exist_ok=False)\n"
        },
        {
          "name": "Seed contract.py part 1",
          "shell": "python",
          "run": "import base64,os,pathlib\np=pathlib.Path(os.environ[\"RUNNER_TEMP\"])/\"mixed-diagnostic-tools\"\nf=p/'contract.py'\nassert not f.exists()\nwith f.open('xb') as stream: stream.write(base64.b64decode(''))\n"
        },
        {
          "name": "Seed ci-supervisor.py part 1",
          "shell": "python",
          "run": "import base64,os,pathlib\np=pathlib.Path(os.environ[\"RUNNER_TEMP\"])/\"mixed-diagnostic-tools\"\nf=p/'ci-supervisor.py'\nassert not f.exists()\nwith f.open('xb') as stream: stream.write(base64.b64decode(''))\n"
        },
        {
          "name": "Seed ci-run.py part 1",
          "shell": "python",
          "run": "import base64,os,pathlib\np=pathlib.Path(os.environ[\"RUNNER_TEMP\"])/\"mixed-diagnostic-tools\"\nf=p/'ci-run.py'\nassert not f.exists()\nwith f.open('xb') as stream: stream.write(base64.b64decode(''))\n"
        },
        {
          "name": "Seed ci-run.py part 2",
          "shell": "python",
          "run": "import base64,os,pathlib\np=pathlib.Path(os.environ[\"RUNNER_TEMP\"])/\"mixed-diagnostic-tools\"\nf=p/'ci-run.py'\nassert f.stat().st_size==9000\nwith f.open('ab') as stream: stream.write(base64.b64decode(''))\n"
        },
        {
          "name": "Seed ci-run.py part 3",
          "shell": "python",
          "run": "import base64,os,pathlib\np=pathlib.Path(os.environ[\"RUNNER_TEMP\"])/\"mixed-diagnostic-tools\"\nf=p/'ci-run.py'\nassert f.stat().st_size==18000\nwith f.open('ab') as stream: stream.write(base64.b64decode(''))\n"
        },
        {
          "name": "Seed local-probe.py part 1",
          "shell": "python",
          "run": "import base64,os,pathlib\np=pathlib.Path(os.environ[\"RUNNER_TEMP\"])/\"mixed-diagnostic-tools\"\nf=p/'local-probe.py'\nassert not f.exists()\nwith f.open('xb') as stream: stream.write(base64.b64decode(''))\n"
        },
        {
          "name": "Seed binding.json part 1",
          "shell": "python",
          "run": "import base64,os,pathlib\np=pathlib.Path(os.environ[\"RUNNER_TEMP\"])/\"mixed-diagnostic-tools\"\nf=p/'binding.json'\nassert not f.exists()\nwith f.open('xb') as stream: stream.write(base64.b64decode(''))\n"
        },
        {
          "name": "Seed binding.json part 2",
          "shell": "python",
          "run": "import base64,os,pathlib\np=pathlib.Path(os.environ[\"RUNNER_TEMP\"])/\"mixed-diagnostic-tools\"\nf=p/'binding.json'\nassert f.stat().st_size==9000\nwith f.open('ab') as stream: stream.write(base64.b64decode(''))\n"
        },
        {
          "name": "Seed binding.json part 3",
          "shell": "python",
          "run": "import base64,os,pathlib\np=pathlib.Path(os.environ[\"RUNNER_TEMP\"])/\"mixed-diagnostic-tools\"\nf=p/'binding.json'\nassert f.stat().st_size==18000\nwith f.open('ab') as stream: stream.write(base64.b64decode(''))\n"
        },
        {
          "name": "Seed binding.json part 4",
          "shell": "python",
          "run": "import base64,os,pathlib\np=pathlib.Path(os.environ[\"RUNNER_TEMP\"])/\"mixed-diagnostic-tools\"\nf=p/'binding.json'\nassert f.stat().st_size==27000\nwith f.open('ab') as stream: stream.write(base64.b64decode(''))\n"
        },
        {
          "name": "Seed binding.json part 5",
          "shell": "python",
          "run": "import base64,os,pathlib\np=pathlib.Path(os.environ[\"RUNNER_TEMP\"])/\"mixed-diagnostic-tools\"\nf=p/'binding.json'\nassert f.stat().st_size==36000\nwith f.open('ab') as stream: stream.write(base64.b64decode(''))\n"
        },
        {
          "name": "Seed binding.json part 6",
          "shell": "python",
          "run": "import base64,os,pathlib\np=pathlib.Path(os.environ[\"RUNNER_TEMP\"])/\"mixed-diagnostic-tools\"\nf=p/'binding.json'\nassert f.stat().st_size==45000\nwith f.open('ab') as stream: stream.write(base64.b64decode(''))\n"
        },
        {
          "name": "Seed binding.json part 7",
          "shell": "python",
          "run": "import base64,os,pathlib\np=pathlib.Path(os.environ[\"RUNNER_TEMP\"])/\"mixed-diagnostic-tools\"\nf=p/'binding.json'\nassert f.stat().st_size==54000\nwith f.open('ab') as stream: stream.write(base64.b64decode(''))\n"
        },
        {
          "name": "Seed binding.json part 8",
          "shell": "python",
          "run": "import base64,os,pathlib\np=pathlib.Path(os.environ[\"RUNNER_TEMP\"])/\"mixed-diagnostic-tools\"\nf=p/'binding.json'\nassert f.stat().st_size==63000\nwith f.open('ab') as stream: stream.write(base64.b64decode(''))\n"
        },
        {
          "name": "Seed binding.json part 9",
          "shell": "python",
          "run": "import base64,os,pathlib\np=pathlib.Path(os.environ[\"RUNNER_TEMP\"])/\"mixed-diagnostic-tools\"\nf=p/'binding.json'\nassert f.stat().st_size==72000\nwith f.open('ab') as stream: stream.write(base64.b64decode(''))\n"
        },
        {
          "name": "Seed binding.json part 10",
          "shell": "python",
          "run": "import base64,os,pathlib\np=pathlib.Path(os.environ[\"RUNNER_TEMP\"])/\"mixed-diagnostic-tools\"\nf=p/'binding.json'\nassert f.stat().st_size==81000\nwith f.open('ab') as stream: stream.write(base64.b64decode(''))\n"
        },
        {
          "name": "Seed binding.json part 11",
          "shell": "python",
          "run": "import base64,os,pathlib\np=pathlib.Path(os.environ[\"RUNNER_TEMP\"])/\"mixed-diagnostic-tools\"\nf=p/'binding.json'\nassert f.stat().st_size==90000\nwith f.open('ab') as stream: stream.write(base64.b64decode(''))\n"
        },
        {
          "name": "Seed binding.json part 12",
          "shell": "python",
          "run": "import base64,os,pathlib\np=pathlib.Path(os.environ[\"RUNNER_TEMP\"])/\"mixed-diagnostic-tools\"\nf=p/'binding.json'\nassert f.stat().st_size==99000\nwith f.open('ab') as stream: stream.write(base64.b64decode(''))\n"
        },
        {
          "name": "Verify sealed runtime scripts and admit runner",
          "shell": "python",
          "run": "import base64,os,pathlib\np=pathlib.Path(os.environ[\"RUNNER_TEMP\"])/\"mixed-diagnostic-tools\"\nimport hashlib\nassert hashlib.sha256((p/'contract.py').read_bytes()).hexdigest()=='a685183286e6b207b351e4f1026eba6752a0e0dd311059ed17b7b11d938686fb'\nassert hashlib.sha256((p/'ci-supervisor.py').read_bytes()).hexdigest()=='c245f79df7e5508cdb0475af20e9e354133fb3368c9ac2e898800c4e813320e3'\nassert hashlib.sha256((p/'ci-run.py').read_bytes()).hexdigest()=='8bfa3935b567f48b8805e5faf88db3cd43df457af77c29cc914222ca1f0d917b'\nassert hashlib.sha256((p/'local-probe.py').read_bytes()).hexdigest()=='aa16f15c665a38b979046cca7b9744d513c1c0f50556fac3e9874dab216a96cd'\nassert hashlib.sha256((p/'binding.json').read_bytes()).hexdigest()=='81702746146350def03785e3f043c3134c44b9180daf64db693263c33f43b5b0'\nimport runpy\ns=runpy.run_path(str(p/\"ci-supervisor.py\"))\ns[\"admission\"](28)\nfor key,value in [(\"core.autocrlf\",\"false\"),(\"core.eol\",\"lf\")]:\n r=s[\"owned\"]([\"git\",\"config\",\"--global\",key,value],\".\",60,p/(key+\".log\"))\n assert r[\"exit_code\"]==0\n"
        },
        {
          "uses": "actions/checkout@v4",
          "with": {
            "ref": "d6e580febd38c2cbae6a12c2ede4040451ec689a",
            "fetch-depth": 0
          }
        },
        {
          "uses": "dtolnay/rust-toolchain@1.93.1",
          "with": {
            "targets": "x86_64-pc-windows-msvc"
          }
        },
        {
          "name": "Optional locked dependency download restore",
          "id": "downloads",
          "continue-on-error": true,
          "uses": "actions/cache/restore@v4",
          "with": {
            "path": "~/.cargo/registry\n~/.cargo/git",
            "key": "math10-mixed-downloads-v1-Windows-X64-1.93.1-6ce14ddc754c452c74c443a647c0b9462ead605a86d06eecfa5907aafdb96366"
          }
        },
        {
          "name": "Compile both standalone targets, list both, run six owned cases once",
          "id": "diagnostic",
          "shell": "pwsh",
          "env": {
            "DOWNLOAD_CACHE_HIT": "${{ steps.downloads.outputs.cache-hit }}",
            "DOWNLOAD_CACHE_MATCHED": "${{ steps.downloads.outputs.cache-matched-key }}",
            "DOWNLOAD_CACHE_PRIMARY": "${{ steps.downloads.outputs.cache-primary-key }}",
            "DOWNLOAD_CACHE_OUTCOME": "${{ steps.downloads.outcome }}"
          },
          "run": "python -X utf8 -B \"$env:RUNNER_TEMP/mixed-diagnostic-tools/ci-run.py\""
        },
        {
          "name": "Retain all actual failure/compiler/source evidence",
          "if": "always()",
          "uses": "actions/upload-artifact@v4",
          "with": {
            "name": "math10-mixed-baseline-evidence-${{ github.run_id }}-${{ github.run_attempt }}",
            "path": "${{ runner.temp }}/math10-mixed-baseline/evidence\n${{ runner.temp }}/mixed-diagnostic-tools",
            "if-no-files-found": "error",
            "retention-days": 7
          }
        },
        {
          "name": "Publish explicitly valid source-bound diagnostic test harnesses",
          "if": "always() && steps.diagnostic.outcome != 'skipped'",
          "uses": "actions/upload-artifact@v4",
          "with": {
            "name": "math10-mixed-baseline-harnesses-${{ github.run_id }}-${{ github.run_attempt }}",
            "path": "${{ runner.temp }}/math10-mixed-baseline/native",
            "if-no-files-found": "ignore",
            "retention-days": 7
          }
        }
      ]
    }
  }
}
