ental\":true,\"runtime_dependencies_opt_level\":3,\"lto\":false,\"codegen_units\":16,\"jobs\":1,\"compiler\":\"1.93.1-x86_64-pc-windows-msvc\",\"argv\":[\"--locked\",\"--profile\",\"release-test\",\"--features\",\"native-skia\",\"-j1\",\"--config\",\"profile.release-test.package.rhwp.opt-level=1\",\"--config\",\"profile.release-test.package.rhwp.incremental=true\"]},\"script_hashes\":{\"contract.py\":\"a685183286e6b207b351e4f1026eba6752a0e0dd311059ed17b7b11d938686fb\",\"ci-supervisor.py\":\"9adcdf52c87ccec34b20f6807b79f757730dea8720858b2b19936a26e394c2f6\",\"ci-run.py\":\"8bfa3935b567f48b8805e5faf88db3cd43df457af77c29cc914222ca1f0d917b\",\"local-probe.py\":\"aa16f15c665a38b979046cca7b9744d513c1c0f50556fac3e9874dab216a96cd\"},\"reviewed_packet_sha256\":\"92b90773370bc07baa00f7b0e88ae91f9925541db64bc75c2afc21cb6eba892e\",\"download_cache_key\":\"math10-mixed-downloads-v1-Windows-X64-1.93.1-d8eeb793103335cac61144fde91bd063799b0dd4ff654205db7211735252209c\",\"production_changed_count\":0,\"original_probe_remote_execution_allowed\":false}",
    "CARGO_BUILD_JOBS": "1",
    "CARGO_TARGET_DIR": "${{ github.workspace }}/rhwp/target"
  },
  "jobs": {
    "baseline": {
      "runs-on": "windows-2025",
      "timeout-minutes": 42,
      "steps": [
        {
          "name": "Decode sealed runtime scripts and admit runner",
          "shell": "python",
          "run": "import base64,os,pathlib\np=pathlib.Path(os.environ[\"RUNNER_TEMP\"])/\"mixed-diagnostic-tools\"\np.mkdir(exist_ok=False)\n(p/'contract.py').write_bytes(base64.b64decode(''))\n(p/'ci-supervisor.py').write_bytes(base64.b64decode(''))\n(p/'ci-run.py').write_bytes(base64.b64decode(''))\n(p/'local-probe.py').write_bytes(base64.b64decode(''))\n(p/\"binding.json\").write_text(os.environ[\"DIAGNOSTIC_JSON\"],encoding=\"utf-8\")\nimport runpy\ns=runpy.run_path(str(p/\"ci-supervisor.py\"))\ns[\"admission\"](28)\nfor key,value in [(\"core.autocrlf\",\"false\"),(\"core.eol\",\"lf\")]:\n r=s[\"owned\"]([\"git\",\"config\",\"--global\",key,value],\".\",60,p/(key+\".log\"))\n assert r[\"exit_code\"]==0\n"
        },
        {
          "uses": "actions/checkout@v4",
          "with": {
            "ref": "ff0841a573e7e529c5688327a3a66d2576868262",
            "fetch-depth": 0
          }
        },
        {
          "uses": "dtolnay/rust-toolchain@1.93.1",
          "with": {
            "targets": "x86_64-pc-windows-msvc"
          }
        },
        {
          "name": "Optional locked dependency download restore",
          "id": "downloads",
          "continue-on-error": true,
          "uses": "actions/cache/restore@v4",
          "with": {
            "path": "~/.cargo/registry\n~/.cargo/git",
            "key": "math10-mixed-downloads-v1-Windows-X64-1.93.1-d8eeb793103335cac61144fde91bd063799b0dd4ff654205db7211735252209c"
          }
        },
        {
          "name": "Compile both standalone targets, list both, run six owned cases once",
          "id": "diagnostic",
          "shell": "pwsh",
          "env": {
            "DOWNLOAD_CACHE_HIT": "${{ steps.downloads.outputs.cache-hit }}",
            "DOWNLOAD_CACHE_MATCHED": "${{ steps.downloads.outputs.cache-matched-key }}",
            "DOWNLOAD_CACHE_PRIMARY": "${{ steps.downloads.outputs.cache-primary-key }}",
            "DOWNLOAD_CACHE_OUTCOME": "${{ steps.downloads.outcome }}"
          },
          "run": "python -X utf8 -B \"$env:RUNNER_TEMP/mixed-diagnostic-tools/ci-run.py\""
        },
        {
          "name": "Retain all actual failure/compiler/source evidence",
          "if": "always()",
          "uses": "actions/upload-artifact@v4",
          "with": {
            "name": "math10-mixed-baseline-evidence-${{ github.run_id }}-${{ github.run_attempt }}",
            "path": "${{ runner.temp }}/math10-mixed-baseline/evidence\n${{ runner.temp }}/mixed-diagnostic-tools",
            "if-no-files-found": "error",
            "retention-days": 7
          }
        },
        {
          "name": "Publish explicitly valid source-bound diagnostic test harnesses",
          "if": "always() && steps.diagnostic.outcome != 'skipped'",
          "uses": "actions/upload-artifact@v4",
          "with": {
            "name": "math10-mixed-baseline-harnesses-${{ github.run_id }}-${{ github.run_attempt }}",
            "path": "${{ runner.temp }}/math10-mixed-baseline/native",
            "if-no-files-found": "ignore",
            "retention-days": 7
          }
        }
      ]
    }
  }
