name: Nightly verification

on:
  schedule:
    # 03:00 Asia/Seoul (GitHub Actions cron uses UTC).
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  engine:
    name: Rust engine and WASM build
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 90

    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-rust
        with:
          wasm: 'true'
          cache: verification

      - name: Install pinned nextest
        uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2.87.2
        with:
          tool: cargo-nextest@0.9.143
          fallback: none

      - name: Cache cargo-audit executable
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ runner.os }}-${{ runner.arch }}-0.22.2

      - name: Install pinned cargo-audit
        run: |
          # Cargo's subcommand invocation can print cargo-audit-audit.
          # Accept either exact pinned spelling instead of rebuilding a valid cache.
          audit_version="$(cargo audit --version 2>/dev/null || true)"
          case "$audit_version" in
            'cargo-audit 0.22.2'|'cargo-audit-audit 0.22.2') ;;
            *) cargo install cargo-audit --version 0.22.2 --locked --force ;;
          esac
          audit_version="$(cargo audit --version)"
          case "$audit_version" in
            'cargo-audit 0.22.2'|'cargo-audit-audit 0.22.2') ;;
            *) echo "Unexpected cargo-audit version: $audit_version" >&2; exit 1 ;;
          esac

      - name: Reject RustSec vulnerabilities and new warnings
        working-directory: rhwp
        run: |
          set -euo pipefail
          # Print accepted existing warnings, then fail if RustSec adds a new warning.
          cargo audit
          cargo audit --no-fetch -D warnings \
            --ignore RUSTSEC-2026-0192 \
            --ignore RUSTSEC-2026-0206

      - name: Test Rust workspace in parallel
        working-directory: rhwp
        run: |
          cargo nextest run --locked --workspace --test-threads 8
          cargo test --locked --workspace --doc

      - uses: ./.github/actions/build-wasm
        with:
          setup-rust: 'false'
      - name: Share tested WASM build
        uses: actions/upload-artifact@v4
        with:
          name: tested-wasm
          path: rhwp/pkg
          if-no-files-found: error
          retention-days: 1

  app:
    needs: engine
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
    name: Desktop, agent, and Studio checks
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 90

    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.23.3
          cache: npm
          cache-dependency-path: |
            package-lock.json
            rhwp/rhwp-studio/package-lock.json
            rhwp/rhwp-agent/package-lock.json
            site-api/package-lock.json

      - name: Use tested WASM build
        uses: actions/download-artifact@v4
        with:
          name: tested-wasm
          path: rhwp/pkg

      - name: Install dependencies
        run: npm run setup

      - name: Audit high and critical production advisories
        run: npm run audit:production

      - name: Report all production advisories for triage
        if: always()
        run: node scripts/audit-production.mjs --report

      - name: Check repository tooling and provider adapter types
        run: |
          npm run test:ci
          npm --prefix rhwp/rhwp-agent run typecheck
          npm --prefix rhwp/rhwp-studio run e2e:check

      - name: Test browser integration
        run: |
          "$PUPPETEER_EXECUTABLE_PATH" --version
          npm --prefix rhwp/rhwp-studio run test:browser

      - name: Test agent hub and process lifecycle
        run: node --test --test-concurrency=1 rhwp/rhwp-agent/tests/*.test.mjs

      - name: Test install counter and waitlist service
        run: |
          npm --prefix site-api ci
          npm --prefix site-api test

      - name: Test Studio
        run: npm --prefix rhwp/rhwp-studio test

      - name: Build Studio
        run: npm --prefix rhwp/rhwp-studio run build

      - name: Test sidebar server setup and recovery
        run: npm run test:sidebar

      - name: Upload sidebar preview evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sidebar-preview-evidence
          path: rhwp/rhwp-studio/sidebar-preview/artifacts/
          if-no-files-found: ignore
          retention-days: 7

      - name: Test document shortcuts, deletion, and agent table reveal
        working-directory: rhwp/rhwp-studio
        env:
          VITE_URL: http://127.0.0.1:7700
          RHWP_SKIP_AGENT_HUB: '1'
        run: |
          node node_modules/vite/bin/vite.js --host 127.0.0.1 --port 7700 --strictPort > "$RUNNER_TEMP/editor-vite.log" 2>&1 &
          editor_pid=$!
          trap 'kill "$editor_pid" 2>/dev/null || true' EXIT
          for attempt in {1..60}; do
            if curl --fail --silent "$VITE_URL" > /dev/null; then break; fi
            if ! kill -0 "$editor_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/editor-vite.log"
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent "$VITE_URL" > /dev/null
          node e2e/global-shortcut.test.mjs --mode=headless
          node e2e/deletion-caret.test.mjs --mode=headless
          node e2e/agent-table-reveal.test.mjs --mode=headless
