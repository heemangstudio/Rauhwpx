name: PR 427 Windows ConPTY validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup-terminal:
    runs-on: blacksmith-2vcpu-windows-2025
    timeout-minutes: 10
    steps:
      - name: Check out PR head
        uses: actions/checkout@v5
        with:
          ref: 33a4ca6ac35f7452c603c58985de9652890a475b
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.23.3
          cache: npm
          cache-dependency-path: rhwp/rhwp-agent/package-lock.json

      - name: Install agent production dependencies
        shell: bash
        run: npm --prefix rhwp/rhwp-agent ci --omit=dev

      - name: Exercise real Windows terminal and cancellation
        shell: bash
        run: node --test rhwp/rhwp-agent/tests/setup-terminal.test.mjs

      - name: Exercise packaged-login probe with Node as host
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import path from 'node:path';
          import { smokePackagedSetupTerminal } from './scripts/packaged-agent-hub-smoke.mjs';
          await smokePackagedSetupTerminal({
            executable: process.execPath,
            agentDir: path.resolve('rhwp/rhwp-agent'),
            timeoutMs: 15_000,
          });
          console.log('Windows ConPTY login probe passed');
          NODE
