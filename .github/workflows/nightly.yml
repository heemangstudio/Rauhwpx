name: Nightly verification

# Independent jobs, so one failure never hides another suite's result.
on:
  schedule:
    # 03:00 Asia/Seoul (GitHub Actions cron uses UTC).
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rust-tests:
    name: Rust tests
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          # rhwp/pdf and rhwp/pdf-large (300 MB) only feed local parity tools.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/rhwp/pdf/
            !/rhwp/pdf-large/
      - uses: ./.github/actions/setup-rust
        with:
          cache: verification
      - name: Install pinned nextest
        uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2.87.2
        with:
          tool: cargo-nextest@0.9.143
          fallback: none
      - name: Test Rust workspace in parallel
        working-directory: rhwp
        run: cargo nextest run --locked --workspace --test-threads 8
      - name: Test Rust doc examples
        if: ${{ !cancelled() }}
        working-directory: rhwp
        run: cargo test --locked --workspace --doc
      - name: Test corpus roundtrip sweeps
        if: ${{ !cancelled() }}
        working-directory: rhwp
        run: cargo test --locked --profile release-test --test sweeps
      - name: Test Skia PNG and PDF rendering
        if: ${{ !cancelled() }}
        working-directory: rhwp
        run: cargo test --locked --features native-skia --test it

  cargo-audit:
    name: Cargo audit
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          # cargo audit reads only the lock file.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /rhwp/Cargo.toml
            /rhwp/Cargo.lock
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.93.1
      - name: Cache cargo-audit executable
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ runner.os }}-${{ runner.arch }}-0.22.2
      - name: Install pinned cargo-audit
        run: |
          # Cargo's subcommand invocation can print cargo-audit-audit.
          # Accept either exact pinned spelling instead of rebuilding a valid cache.
          audit_version="$(cargo audit --version 2>/dev/null || true)"
          case "$audit_version" in
            'cargo-audit 0.22.2'|'cargo-audit-audit 0.22.2') ;;
            *) cargo install cargo-audit --version 0.22.2 --locked --force ;;
          esac
          audit_version="$(cargo audit --version)"
          case "$audit_version" in
            'cargo-audit 0.22.2'|'cargo-audit-audit 0.22.2') ;;
            *) echo "Unexpected cargo-audit version: $audit_version" >&2; exit 1 ;;
          esac
      - name: Reject RustSec vulnerabilities and new warnings
        working-directory: rhwp
        run: |
          set -euo pipefail
          # Print accepted existing warnings, then fail if RustSec adds a new warning.
          cargo audit
          cargo audit --no-fetch -D warnings \
            --ignore RUSTSEC-2026-0192 \
            --ignore RUSTSEC-2026-0206

  dependencies:
    name: Dependencies
    uses: ./.github/workflows/dependencies.yml

  app:
    name: App
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 45
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.tools/owned-browser-chromium
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/rhwp/pdf/
            !/rhwp/pdf-large/
      - uses: actions/setup-node@v5
        with:
          node-version: 22.23.3
          cache: npm
          cache-dependency-path: |
            package-lock.json
            rhwp/rhwp-studio/package-lock.json
            rhwp/rhwp-agent/package-lock.json
            site-api/package-lock.json
      - name: Install dependencies
        run: npm run setup
      # Studio unit tests run edit history and save checks on the real engine.
      - uses: ./.github/actions/build-wasm
      - name: Test Studio
        run: npm --prefix rhwp/rhwp-studio test
      - name: Cache managed Chromium
        if: ${{ !cancelled() }}
        uses: actions/cache@v4
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: owned-chromium-${{ runner.os }}-${{ hashFiles('rhwp/rhwp-agent/package-lock.json') }}
      - name: Install managed Chromium for hub behavioral tests
        if: ${{ !cancelled() }}
        run: node rhwp/rhwp-agent/node_modules/playwright/cli.js install --with-deps chromium
      - name: Test agent hub
        if: ${{ !cancelled() }}
        run: |
          npm --prefix rhwp/rhwp-agent run typecheck
          node --test rhwp/rhwp-agent/tests/*.test.mjs
      - name: Test desktop main process and repository scripts
        if: ${{ !cancelled() }}
        run: |
          npm run test:desktop
          npm run test:ci
      - name: Test site API
        if: ${{ !cancelled() }}
        run: |
          npm --prefix site-api ci
          npm --prefix site-api test

  browser:
    name: Browser
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 45
    env:
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/rhwp/pdf/
            !/rhwp/pdf-large/
      - uses: actions/setup-node@v5
        with:
          node-version: 22.23.3
          cache: npm
          cache-dependency-path: |
            rhwp/rhwp-studio/package-lock.json
            rhwp/rhwp-agent/package-lock.json
      - uses: ./.github/actions/build-wasm
      - name: Install Studio and hub dependencies
        run: |
          npm --prefix rhwp/rhwp-studio ci
          npm --prefix rhwp/rhwp-agent ci --no-audit --no-fund
      - name: Build and typecheck Studio
        run: npm --prefix rhwp/rhwp-studio run build
      - name: Test browser integration
        if: ${{ !cancelled() }}
        run: |
          "$PUPPETEER_EXECUTABLE_PATH" --version
          npm --prefix rhwp/rhwp-studio run test:browser

  sidebar:
    name: Sidebar preview
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    env:
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/rhwp/pdf/
            !/rhwp/pdf-large/
      - uses: actions/setup-node@v5
        with:
          node-version: 22.23.3
          cache: npm
          cache-dependency-path: |
            rhwp/rhwp-studio/package-lock.json
            rhwp/rhwp-agent/package-lock.json
      - name: Install Studio and hub dependencies
        run: |
          npm --prefix rhwp/rhwp-studio ci
          npm --prefix rhwp/rhwp-agent ci --no-audit --no-fund
      - name: Test sidebar server setup and recovery
        run: npm run test:sidebar
      - name: Upload sidebar preview evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: sidebar-preview-evidence
          path: rhwp/rhwp-studio/sidebar-preview/artifacts/
          if-no-files-found: ignore
          retention-days: 7

  e2e:
    name: Editor smoke flows
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    env:
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.tools/owned-browser-chromium
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/rhwp/pdf/
            !/rhwp/pdf-large/
      - uses: actions/setup-node@v5
        with:
          node-version: 22.23.3
          cache: npm
          cache-dependency-path: |
            rhwp/rhwp-studio/package-lock.json
            rhwp/rhwp-agent/package-lock.json
      - uses: ./.github/actions/build-wasm
      - name: Install Studio and hub dependencies
        run: |
          npm --prefix rhwp/rhwp-studio ci
          npm --prefix rhwp/rhwp-agent ci --no-audit --no-fund
      - name: Run editor smoke flows
        run: npm --prefix rhwp/rhwp-studio run e2e:smoke
      - name: Cache managed Chromium
        uses: actions/cache@v4
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: owned-chromium-${{ runner.os }}-${{ hashFiles('rhwp/rhwp-agent/package-lock.json') }}
      - name: Install managed Chromium for owned browser flows
        run: node rhwp/rhwp-agent/node_modules/playwright/cli.js install --with-deps chromium
      - name: Run owned browser research flows
        run: node rhwp/rhwp-studio/e2e/owned-browser-live.mjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: smoke-server-logs
          path: |
            rhwp/target/smoke-hub.log
            rhwp/target/smoke-vite.log
            docs/pr-evidence/owned-browser/
          if-no-files-found: ignore
          retention-days: 7
