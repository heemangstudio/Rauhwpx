name: Production dependencies

# Installs the real packaged dependencies on every desktop platform and audits them.
# Runs nightly (nightly.yml) and on pull requests that change a lock, a manifest or packaging.
on:
  pull_request:
    paths:
      - package.json
      - package-lock.json
      - rhwp/rhwp-agent/package.json
      - rhwp/rhwp-agent/package-lock.json
      - rhwp/rhwp-studio/package.json
      - rhwp/rhwp-studio/package-lock.json
      - site-api/package.json
      - site-api/package-lock.json
      - build/**
      - scripts/audit-production.mjs
      - scripts/verify-production-dependencies.mjs
      - .github/workflows/dependencies.yml
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-dependencies:
    name: Production dependencies (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            runner: blacksmith-6vcpu-macos-15
            architecture: arm64
          - os: windows-latest
            runner: blacksmith-2vcpu-windows-2025
            architecture: x64
          - os: ubuntu-24.04
            runner: blacksmith-4vcpu-ubuntu-2404
            architecture: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          # rhwp/pdf and rhwp/pdf-large (300 MB) only feed local parity tools.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/rhwp/pdf/
            !/rhwp/pdf-large/
      - uses: actions/setup-node@v5
        with:
          node-version: 22.23.3
          cache: npm
          cache-dependency-path: |
            package-lock.json
            rhwp/rhwp-agent/package-lock.json
            rhwp/rhwp-studio/package-lock.json
            site-api/package-lock.json
      - name: Assert runner architecture
        shell: bash
        env:
          EXPECTED_NODE_ARCH: ${{ matrix.architecture }}
        run: node -e "if (process.arch !== process.env.EXPECTED_NODE_ARCH) throw new Error('Unexpected architecture ' + process.arch)"
      - name: Install actual packaged dependencies
        shell: bash
        run: |
          for directory in . rhwp/rhwp-agent rhwp/rhwp-studio site-api; do
            npm --prefix "$directory" ci --no-audit --no-fund
          done
      - name: Install the locked Electron Node host
        run: node node_modules/electron/install.js
      - name: Audit high and critical production advisories
        shell: bash
        run: npm run audit:production | tee production-audit.log
      - name: Report all production advisories for triage
        if: ${{ !cancelled() }}
        run: node scripts/audit-production.mjs --report
      - name: Verify bundled npm and Electron Node floor
        if: ${{ !cancelled() }}
        shell: bash
        run: node scripts/verify-production-dependencies.mjs --electron | tee production-runtime.json
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: production-dependencies-${{ matrix.os }}
          path: |
            production-audit.log
            production-runtime.json
          if-no-files-found: ignore
          retention-days: 7
