name: Repository checks

on:
  pull_request:
  workflow_dispatch:

# Keep every check on Blacksmith; prioritize runtime and cache correct downloads.
permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: Docs and website
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22.23.3
      - name: Check website links and assets
        run: python3 website/check.py
      - name: Check publish docs
        run: npm run check:docs

  changes:
    name: Select affected checks
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    outputs:
      sessions: ${{ steps.changes.outputs.sessions }}
      app: ${{ steps.changes.outputs.app }}
      browser: ${{ steps.changes.outputs.browser }}
      engine: ${{ steps.changes.outputs.engine }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
          sparse-checkout: scripts
      - id: changes
        run: node scripts/ci-changes.mjs

  session-tests:
    name: Session tests (${{ matrix.os }})
    needs: changes
    # Expand the matrix even for docs so every protected check name is reported.
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            runner: blacksmith-6vcpu-macos-15
            architecture: arm64
          - os: windows-latest
            runner: blacksmith-2vcpu-windows-2025
            architecture: x64
    runs-on: ${{ needs.changes.outputs.sessions == 'false' && 'blacksmith-2vcpu-ubuntu-2404' || matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        if: needs.changes.outputs.sessions != 'false'
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        if: needs.changes.outputs.sessions != 'false'
        with:
          node-version: 22.23.3
          cache: npm
          cache-dependency-path: rhwp/rhwp-agent/package-lock.json
      - name: Assert runner architecture
        if: needs.changes.outputs.sessions != 'false'
        shell: bash
        env:
          EXPECTED_NODE_ARCH: ${{ matrix.architecture }}
        run: node -e "if (process.arch !== process.env.EXPECTED_NODE_ARCH) throw new Error('Unexpected architecture ' + process.arch)"
      - name: Install agent dependencies
        if: needs.changes.outputs.sessions != 'false'
        run: npm --prefix rhwp/rhwp-agent ci
      - name: Test platform launch, file replacement, and desktop sessions
        if: needs.changes.outputs.sessions != 'false'
        shell: bash
        run: >-
          node --test --test-concurrency=1
          rhwp/rhwp-agent/tests/windows-cli-launch.test.mjs
          rhwp/rhwp-agent/tests/windows-setup-hardening.test.mjs
          rhwp/rhwp-studio/tests/desktop-agent-hub.test.ts
          rhwp/rhwp-studio/tests/desktop-shell.test.ts
          tests/desktop-system-fonts.test.mjs

  production-dependencies:
    name: Production dependencies (${{ matrix.os }})
    needs: changes
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            runner: blacksmith-6vcpu-macos-15
            architecture: arm64
          - os: windows-latest
            runner: blacksmith-2vcpu-windows-2025
            architecture: x64
          - os: ubuntu-24.04
            runner: blacksmith-4vcpu-ubuntu-2404
            architecture: x64
    runs-on: ${{ needs.changes.outputs.app == 'false' && 'blacksmith-2vcpu-ubuntu-2404' || matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        if: needs.changes.outputs.app != 'false'
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        if: needs.changes.outputs.app != 'false'
        with:
          node-version: 22.23.3
          cache: npm
          cache-dependency-path: |
            package-lock.json
            rhwp/rhwp-agent/package-lock.json
            rhwp/rhwp-studio/package-lock.json
            site-api/package-lock.json
      - name: Assert runner architecture
        if: needs.changes.outputs.app != 'false'
        shell: bash
        env:
          EXPECTED_NODE_ARCH: ${{ matrix.architecture }}
        run: node -e "if (process.arch !== process.env.EXPECTED_NODE_ARCH) throw new Error('Unexpected architecture ' + process.arch)"
      - name: Install actual packaged dependencies
        if: needs.changes.outputs.app != 'false'
        shell: bash
        run: |
          for directory in . rhwp/rhwp-agent rhwp/rhwp-studio site-api; do
            npm --prefix "$directory" ci --no-audit --no-fund
          done
      - name: Install the locked Electron Node host
        if: needs.changes.outputs.app != 'false'
        run: node node_modules/electron/install.js
      - name: Audit all production dependency locks
        if: needs.changes.outputs.app != 'false'
        shell: bash
        run: npm run audit:production | tee production-audit.log
      - name: Verify bundled npm and Electron Node floor
        if: needs.changes.outputs.app != 'false'
        shell: bash
        run: node scripts/verify-production-dependencies.mjs --electron | tee production-runtime.json
      - uses: actions/upload-artifact@v4
        if: ${{ always() && needs.changes.outputs.app != 'false' }}
        with:
          name: production-dependencies-${{ matrix.os }}
          path: |
            production-audit.log
            production-runtime.json
          if-no-files-found: ignore
          retention-days: 7

  app:
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    name: Auth and resource boundary regressions
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.app == 'true') }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22.23.3
          cache: npm
          cache-dependency-path: |
            package-lock.json
            rhwp/rhwp-studio/package-lock.json
            rhwp/rhwp-agent/package-lock.json
            site-api/package-lock.json
      - name: Install dependencies
        run: npm run setup
      - name: Test repository tooling
        run: npm run test:ci
      - name: Check provider adapter types
        run: npm --prefix rhwp/rhwp-agent run typecheck
      - name: Test agent, auth, and resource boundaries
        run: node --test --test-concurrency=1 rhwp/rhwp-agent/tests/*.test.mjs
      - name: Test install counter and waitlist service
        run: |
          npm --prefix site-api ci
          npm --prefix site-api test
      - name: Test Studio
        run: npm --prefix rhwp/rhwp-studio test
      - name: Check E2E entry points
        run: npm --prefix rhwp/rhwp-studio run e2e:check
      - name: Test browser extension security boundaries
        run: >-
          node --test
          rhwp/rhwp-shared/security/*.test.js
          rhwp/rhwp-chrome/sw/fetch-security.test.mjs
          rhwp/rhwp-firefox/sw/fetch-security.test.mjs
          rhwp/rhwp-safari/src/fetch-security.test.mjs
      - name: Test desktop main process
        run: npm run test:desktop

  browser:
    name: Studio browser integration
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.browser == 'true') }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 45
    env:
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22.23.3
          cache: npm
          cache-dependency-path: rhwp/rhwp-studio/package-lock.json
      - uses: ./.github/actions/build-wasm
      - name: Install Studio dependencies
        run: npm --prefix rhwp/rhwp-studio ci
      - name: Install hub dependencies for live editor verification
        run: npm --prefix rhwp/rhwp-agent ci --no-audit --no-fund
      - name: Verify provisioned browser
        run: '"$PUPPETEER_EXECUTABLE_PATH" --version'
      - name: Build and typecheck Studio
        run: npm --prefix rhwp/rhwp-studio run build
      - name: Test browser integration
        run: npm --prefix rhwp/rhwp-studio run test:browser

  parser-boundaries:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.engine == 'true') }}
    name: Hostile document input boundaries
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-rust
        with:
          cache: parser

      - name: Test parser limits, bounded ingestion, and hostile HML identifiers
        working-directory: rhwp
        run: |
          set -euo pipefail
          # Fail when a filter matches no tests so renames cannot silently skip a gate.
          run_nonempty() {
            local output
            output="$(mktemp)"
            cargo test --locked "$@" 2>&1 | tee "${output}"
            if ! grep -Eq 'test result: ok\. [1-9][0-9]* passed;' "${output}"; then
              echo "No tests ran for: cargo test $*" >&2
              exit 1
            fi
            rm -f "${output}"
          }
          run_nonempty --lib parser::
          run_nonempty --bin rhwp cli_reader_rejects_oversized_files_before_unbounded_reading
          run_nonempty --test issue_2743_hml_resource_id_limit
