name: Repository checks

# Each job runs only when its paths changed (scripts/ci-changes.mjs).
# Browser flows and production dependency audits run nightly (nightly.yml).
# Website checks run before the Pages deploy (pages.yml); publish docs are checked at release.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Select checks
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    outputs:
      engine: ${{ steps.changes.outputs.engine }}
      sessions: ${{ steps.changes.outputs.sessions }}
      app: ${{ steps.changes.outputs.app }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
          sparse-checkout: scripts
      - id: changes
        run: node scripts/ci-changes.mjs

  secrets:
    # Every PR, whatever it touches: no key-shaped literal in any tracked file.
    name: Secret scan
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          # Parity PDFs are binary; git grep skips them anyway.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/rhwp/pdf/
            !/rhwp/pdf-large/
      - run: node scripts/check-secrets.mjs

  engine:
    name: Engine
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          # rhwp/pdf and rhwp/pdf-large (300 MB) only feed local parity tools.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/rhwp/pdf/
            !/rhwp/pdf-large/
      - uses: ./.github/actions/setup-rust
        with:
          cache: parser
      - name: Install pinned nextest
        uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2.87.2
        with:
          tool: cargo-nextest@0.9.143
          fallback: none
      - name: Test engine
        working-directory: rhwp
        # Unit tests and the single `it` integration binary. Doc tests and corpus sweeps run nightly.
        run: cargo nextest run --locked
      - name: Check that the hostile-input gates still exist
        working-directory: rhwp
        run: |
          set -euo pipefail
          # Fail when a filter matches no tests so renames cannot silently drop a gate.
          run_nonempty() {
            local output
            output="$(mktemp)"
            cargo test --locked "$@" 2>&1 | tee "${output}"
            if ! grep -Eq 'test result: ok\. [1-9][0-9]* passed;' "${output}"; then
              echo "No tests ran for: cargo test $*" >&2
              exit 1
            fi
            rm -f "${output}"
          }
          run_nonempty --lib parser::
          run_nonempty --bin rhwp cli_reader_rejects_oversized_files_before_unbounded_reading
          run_nonempty --test it issue_2743

  app:
    name: App
    needs: changes
    if: needs.changes.outputs.app != ''
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.tools/owned-browser-chromium
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/rhwp/pdf/
            !/rhwp/pdf-large/
      - uses: actions/setup-node@v5
        with:
          node-version: 22.23.3
          cache: npm
          cache-dependency-path: |
            package-lock.json
            rhwp/rhwp-studio/package-lock.json
            rhwp/rhwp-agent/package-lock.json
            site-api/package-lock.json
      - name: Install dependencies
        if: contains(needs.changes.outputs.app, 'studio') || contains(needs.changes.outputs.app, 'hub') || contains(needs.changes.outputs.app, 'desktop')
        run: npm run setup
      # Studio unit tests run edit history and save checks on the real engine.
      - uses: ./.github/actions/build-wasm
        if: contains(needs.changes.outputs.app, 'studio')
      - name: Test Studio
        if: contains(needs.changes.outputs.app, 'studio')
        run: npm --prefix rhwp/rhwp-studio test
      - name: Build and typecheck Studio
        if: contains(needs.changes.outputs.app, 'studio')
        run: npm --prefix rhwp/rhwp-studio run build
      - name: Cache managed Chromium
        if: contains(needs.changes.outputs.app, 'hub')
        uses: actions/cache@v4
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: owned-chromium-${{ runner.os }}-${{ hashFiles('rhwp/rhwp-agent/package-lock.json') }}
      - name: Install managed Chromium for hub behavioral tests
        if: contains(needs.changes.outputs.app, 'hub')
        run: node rhwp/rhwp-agent/node_modules/playwright/cli.js install --with-deps chromium
      # GitHub's Ubuntu 24.04 image restricts unprivileged user namespaces with
      # AppArmor, which prevents the sandboxed managed Chromium from starting.
      - name: Allow the Chromium sandbox
        if: contains(needs.changes.outputs.app, 'hub')
        run: |
          sysctl=/proc/sys/kernel/apparmor_restrict_unprivileged_userns
          if [ -e "$sysctl" ]; then echo 0 | sudo tee "$sysctl"; fi
      - name: Test agent hub
        if: contains(needs.changes.outputs.app, 'hub')
        run: |
          npm --prefix rhwp/rhwp-agent run typecheck
          node --test rhwp/rhwp-agent/tests/*.test.mjs
      - name: Test desktop main process and packaging scripts
        if: contains(needs.changes.outputs.app, 'desktop')
        run: |
          npm run test:desktop
          npm run test:ci
      - name: Test site API
        if: contains(needs.changes.outputs.app, 'site')
        run: |
          npm --prefix site-api ci
          npm --prefix site-api test

  session-tests:
    # macOS session tests run nightly (nightly.yml).
    name: Session tests (windows-latest)
    needs: changes
    if: needs.changes.outputs.sessions == 'true'
    runs-on: blacksmith-4vcpu-windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          # These tests read no sample documents.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/rhwp/pdf/
            !/rhwp/pdf-large/
            !/rhwp/samples/
      - uses: actions/setup-node@v5
        with:
          node-version: 22.23.3
          cache: npm
          cache-dependency-path: rhwp/rhwp-agent/package-lock.json
      - name: Assert runner architecture
        shell: bash
        run: node -e "if (process.arch !== 'x64') throw new Error('Unexpected architecture ' + process.arch)"
      - name: Install agent dependencies
        run: npm --prefix rhwp/rhwp-agent ci
      - name: Test platform launch, file replacement, and desktop sessions
        run: npm run test:sessions
