name: Repository checks

# Each job runs only when its paths changed (scripts/ci-changes.mjs).
# Production dependency audits live in dependencies.yml.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Select checks
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    outputs:
      engine: ${{ steps.changes.outputs.engine }}
      browser: ${{ steps.changes.outputs.browser }}
      sessions: ${{ steps.changes.outputs.sessions }}
      docs: ${{ steps.changes.outputs.docs }}
      app: ${{ steps.changes.outputs.app }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
          sparse-checkout: scripts
      - id: changes
        run: node scripts/ci-changes.mjs

  engine:
    name: Engine
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          # rhwp/pdf and rhwp/pdf-large (300 MB) only feed local parity tools.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/rhwp/pdf/
            !/rhwp/pdf-large/
      - uses: ./.github/actions/setup-rust
        with:
          cache: parser
      - name: Test parser limits, bounded ingestion, and hostile HML identifiers
        working-directory: rhwp
        run: |
          set -euo pipefail
          # Fail when a filter matches no tests so renames cannot silently skip a gate.
          run_nonempty() {
            local output
            output="$(mktemp)"
            cargo test --locked "$@" 2>&1 | tee "${output}"
            if ! grep -Eq 'test result: ok\. [1-9][0-9]* passed;' "${output}"; then
              echo "No tests ran for: cargo test $*" >&2
              exit 1
            fi
            rm -f "${output}"
          }
          run_nonempty --lib parser::
          run_nonempty --bin rhwp cli_reader_rejects_oversized_files_before_unbounded_reading
          run_nonempty --test issue_2743_hml_resource_id_limit

  app:
    name: App
    needs: changes
    if: needs.changes.outputs.app != ''
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/rhwp/pdf/
            !/rhwp/pdf-large/
      - uses: actions/setup-node@v5
        with:
          node-version: 22.23.3
          cache: npm
          cache-dependency-path: |
            package-lock.json
            rhwp/rhwp-studio/package-lock.json
            rhwp/rhwp-agent/package-lock.json
            site-api/package-lock.json
      - name: Install dependencies
        if: contains(needs.changes.outputs.app, 'studio') || contains(needs.changes.outputs.app, 'hub') || contains(needs.changes.outputs.app, 'desktop')
        run: npm run setup
      - name: Test Studio
        if: contains(needs.changes.outputs.app, 'studio')
        run: |
          npm --prefix rhwp/rhwp-studio test
          npm --prefix rhwp/rhwp-studio run e2e:check
      - name: Test agent hub
        if: contains(needs.changes.outputs.app, 'hub')
        run: |
          npm --prefix rhwp/rhwp-agent run typecheck
          node --test rhwp/rhwp-agent/tests/*.test.mjs
      - name: Test desktop main process and packaging scripts
        if: contains(needs.changes.outputs.app, 'desktop')
        run: |
          npm run test:desktop
          npm run test:ci
      - name: Test site API
        if: contains(needs.changes.outputs.app, 'site')
        run: |
          npm --prefix site-api ci
          npm --prefix site-api test
      - name: Test browser extension security boundaries
        if: contains(needs.changes.outputs.app, 'extensions')
        run: >-
          node --test
          rhwp/rhwp-shared/security/*.test.js
          rhwp/rhwp-chrome/sw/fetch-security.test.mjs
          rhwp/rhwp-firefox/sw/fetch-security.test.mjs
          rhwp/rhwp-safari/src/fetch-security.test.mjs

  browser:
    name: Browser
    needs: changes
    if: needs.changes.outputs.browser == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 45
    env:
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/rhwp/pdf/
            !/rhwp/pdf-large/
      - uses: actions/setup-node@v5
        with:
          node-version: 22.23.3
          cache: npm
          cache-dependency-path: |
            rhwp/rhwp-studio/package-lock.json
            rhwp/rhwp-agent/package-lock.json
      - uses: ./.github/actions/build-wasm
      - name: Install Studio and hub dependencies
        run: |
          npm --prefix rhwp/rhwp-studio ci
          npm --prefix rhwp/rhwp-agent ci --no-audit --no-fund
      - name: Build and typecheck Studio
        run: npm --prefix rhwp/rhwp-studio run build
      - name: Test browser integration
        run: |
          "$PUPPETEER_EXECUTABLE_PATH" --version
          npm --prefix rhwp/rhwp-studio run test:browser

  docs:
    name: Docs
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/rhwp/pdf/
            !/rhwp/pdf-large/
      - uses: actions/setup-node@v5
        with:
          node-version: 22.23.3
      - name: Check website links and assets
        run: python3 website/check.py
      - name: Check publish docs
        run: npm run check:docs

  session-tests:
    name: Session tests (${{ matrix.os }})
    needs: changes
    # Branch protection requires both names, so the matrix always reports.
    # Without session changes it finishes on a small Linux runner with every step skipped.
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            runner: blacksmith-6vcpu-macos-15
            architecture: arm64
          - os: windows-latest
            runner: blacksmith-2vcpu-windows-2025
            architecture: x64
    runs-on: ${{ needs.changes.outputs.sessions == 'false' && 'blacksmith-2vcpu-ubuntu-2404' || matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        if: needs.changes.outputs.sessions != 'false'
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/rhwp/pdf/
            !/rhwp/pdf-large/
      - uses: actions/setup-node@v5
        if: needs.changes.outputs.sessions != 'false'
        with:
          node-version: 22.23.3
          cache: npm
          cache-dependency-path: rhwp/rhwp-agent/package-lock.json
      - name: Assert runner architecture
        if: needs.changes.outputs.sessions != 'false'
        shell: bash
        env:
          EXPECTED_NODE_ARCH: ${{ matrix.architecture }}
        run: node -e "if (process.arch !== process.env.EXPECTED_NODE_ARCH) throw new Error('Unexpected architecture ' + process.arch)"
      - name: Install agent dependencies
        if: needs.changes.outputs.sessions != 'false'
        run: npm --prefix rhwp/rhwp-agent ci
      - name: Test platform launch, file replacement, and desktop sessions
        if: needs.changes.outputs.sessions != 'false'
        shell: bash
        run: >-
          node --test --test-concurrency=1
          rhwp/rhwp-agent/tests/windows-cli-launch.test.mjs
          rhwp/rhwp-agent/tests/windows-setup-hardening.test.mjs
          rhwp/rhwp-studio/tests/desktop-agent-hub.test.ts
          rhwp/rhwp-studio/tests/desktop-shell.test.ts
          tests/desktop-system-fonts.test.mjs
          tests/desktop-pdf-export.test.mjs
