        """Available-evidence sealing only. No owner, driver, fixture or native imports."""
        import hashlib
        import json
        from pathlib import Path
        import sys
        
        
        def seal_available(directory, prior_status):
            # Explicit selected interpreter path and -X utf8 -B are supplied by the recipe.
            if sys.flags.optimize != 0:
                raise RuntimeError('forensic sealing prohibits optimized Python')
            directory = Path(directory)
            directory.mkdir(exist_ok=True)
            items = {}
            errors = []
            for p in sorted(directory.rglob('*')):
                if p.name in ('artifact-sha256.json', 'forensic-seal-error.json'):
                    continue
                try:
                    if p.is_symlink():
                        raise ValueError('unexpected artifact symlink')
                    if p.is_file():
                        data = p.read_bytes()
                        items[p.relative_to(directory).as_posix()] = dict(
                            bytes=len(data), sha256=hashlib.sha256(data).hexdigest())
                except Exception as exc:
                    errors.append(dict(path=p.relative_to(directory).as_posix(), error=type(exc).__name__))
            result = dict(files=items, seal_errors=errors, prior_job_status=prior_status,
                          status='FAILED_UNACCEPTED' if prior_status != 'success' or errors else 'PENDING_ROOT_ARTIFACT_INSPECTION',
                          root_acceptance=False, runtime_acceptance=False, engine_verified=False, parity_accepted=False)
            with (directory / 'artifact-sha256.json').open('w', encoding='utf-8', newline='\n') as f:
                json.dump(result, f, indent=2)
                f.write('\n')
            if errors:
                raise RuntimeError('forensic seal incomplete; available files retained')
            return result
        
        
        def forensic_main(directory, prior_status):
            try:
                return seal_available(directory, prior_status)
            except Exception as exc:
                # stdout remains evidence even if the evidence directory is unwritable.
                error = dict(status='FAILED_UNACCEPTED', error=type(exc).__name__,
                             prior_job_status=prior_status, root_acceptance=False,
                             runtime_acceptance=False, engine_verified=False, parity_accepted=False)
                print('TINY_CI_SEAL_ERROR ' + json.dumps(error), flush=True)
                if sys.flags.optimize == 0:
                    try:
                        with (Path(directory) / 'forensic-seal-error.json').open('w', encoding='utf-8') as f:
                            json.dump(error, f)
                    except Exception:
                        pass
                raise
        
        import os
        forensic_main(Path(os.environ['RUNNER_TEMP']) / 'natural-drain-tiny-evidence', '${{ job.status }}')
        
