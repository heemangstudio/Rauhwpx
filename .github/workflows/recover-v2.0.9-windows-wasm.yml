name: Recover v2.0.9 Windows WASM cache

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: Release tag to recover
        required: true
        default: v2.0.9
      tested_run_id:
        description: Successful nightly run containing tested-wasm
        required: true
        default: '36622094496'

permissions:
  actions: read
  contents: read

jobs:
  seed-cache:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Require the approved recovery source and default branch
        shell: bash
        env:
          TARGET_REF: ${{ inputs.target_ref }}
          TESTED_RUN_ID: ${{ inputs.tested_run_id }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          test "$TARGET_REF" = v2.0.9
          test "$TESTED_RUN_ID" = 36622094496

      - name: Check out the release tag
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.target_ref }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 22.18.0

      - name: Verify the tested nightly run and artifact
        id: tested
        uses: actions/github-script@v8
        env:
          TESTED_RUN_ID: ${{ inputs.tested_run_id }}
        with:
          script: |
            const runId = Number(process.env.TESTED_RUN_ID);
            const { owner, repo } = context.repo;
            const { data: run } = await github.rest.actions.getWorkflowRun({ owner, repo, run_id: runId });
            if (run.head_repository?.full_name !== `${owner}/${repo}` ||
                run.path !== '.github/workflows/nightly.yml' ||
                run.event !== 'workflow_dispatch' || run.conclusion !== 'success' ||
                run.head_sha !== '51c08658227fda43ea1e7ff7f37d84b1f2315be8') {
              throw new Error('The source run is not the verified nightly run.');
            }
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              owner, repo, run_id: runId, per_page: 100,
            });
            const artifact = artifacts.find(item => item.name === 'tested-wasm' && !item.expired);
            if (!artifact) throw new Error('The tested-wasm artifact has expired or is missing.');
            core.setOutput('sha', run.head_sha);

      - name: Verify source identity and engine fingerprint
        id: source
        shell: bash
        env:
          TESTED_SHA: ${{ steps.tested.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = e16bc1a112087e79e074a1e3a702e10b22f6d763
          test "$(git rev-parse "$TESTED_SHA:scripts/wasm-source-fingerprint.mjs")" = "$(git rev-parse HEAD:scripts/wasm-source-fingerprint.mjs)"
          git worktree add --detach "$RUNNER_TEMP/tested-source" "$TESTED_SHA"
          tested_digest="$(cd "$RUNNER_TEMP/tested-source" && node scripts/wasm-source-fingerprint.mjs)"
          release_digest="$(node scripts/wasm-source-fingerprint.mjs)"
          test "$tested_digest" = "$release_digest"
          test "$release_digest" = 9504f9c1cd06713a67932bbc61986a324b14ed8f9df8991c658be60380a858cb
          echo "digest=$release_digest" >> "$GITHUB_OUTPUT"

      - name: Verify the exact release cache key
        id: cache-key
        shell: bash
        env:
          DIGEST: ${{ steps.source.outputs.digest }}
          CONFIG_HASH: ${{ hashFiles('.cargo/**', 'rust-toolchain*', '.github/actions/setup-rust/action.yml', '.github/actions/build-wasm/action.yml', 'scripts/wasm-source-fingerprint.mjs', 'package.json') }}
        run: |
          set -euo pipefail
          key="wasm-pkg-v1-${RUNNER_OS}-${RUNNER_ARCH}-${DIGEST}-${CONFIG_HASH}"
          test "$key" = wasm-pkg-v1-Windows-X64-9504f9c1cd06713a67932bbc61986a324b14ed8f9df8991c658be60380a858cb-2dcba9c2a8d95476caa84349a71425293bae016ecc841b46653fdde4df2c5dd9
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - name: Check for an existing release cache
        id: pkg
        uses: actions/cache/restore@v4
        with:
          path: rhwp/pkg
          key: ${{ steps.cache-key.outputs.key }}

      - name: Verify an existing cache
        if: steps.pkg.outputs.cache-hit == 'true'
        shell: bash
        run: |
          test -s rhwp/pkg/rhwp_bg.wasm
          test -s rhwp/pkg/rhwp.js
          test -s rhwp/pkg/rhwp.d.ts
          test -s rhwp/pkg/rhwp_bg.wasm.d.ts
          test -s rhwp/pkg/package.json

      - name: Clear package directory before artifact download
        shell: bash
        run: rm -rf rhwp/pkg

      - name: Download the tested WASM package
        uses: actions/download-artifact@v4
        with:
          name: tested-wasm
          path: rhwp/pkg
          run-id: ${{ inputs.tested_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}

      - name: Verify the complete WASM package
        shell: bash
        run: |
          test -s rhwp/pkg/rhwp_bg.wasm
          test -s rhwp/pkg/rhwp.js
          test -s rhwp/pkg/rhwp.d.ts
          test -s rhwp/pkg/rhwp_bg.wasm.d.ts
          test -s rhwp/pkg/package.json

      - name: Save the release Windows cache
        if: steps.pkg.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: rhwp/pkg
          key: ${{ steps.pkg.outputs.cache-primary-key }}
