# Temporary diagnostic retrieval only. Do not merge or ship.
name: Math10 diagnostic WASM recovery r16
'on':
  push:
    branches: [ci/math10-candidate-r15]
permissions:
  contents: read
concurrency:
  group: math10-wasm-debug-r16-${{ github.ref }}
  cancel-in-progress: false
env:
  CANDIDATE: d778f395abd773e4d08d7ba972d88ce60ac04acc
  SOURCE_TREE: 74d5b8026102825d741025235e2e843fb67debbf
  ENGINE_FINGERPRINT: 280d257adbf3e72d7009f449227da7ab80ce310b82115f0ddef228e3648cf0ab
  GIT_LFS_SKIP_SMUDGE: '1'
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          ref: d778f395abd773e4d08d7ba972d88ce60ac04acc
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22.23.3
      - name: Check exact source before cache restoration
        shell: python3 -u {0}
        run: |
          import hashlib, json, os, subprocess
          from pathlib import Path
          def git(*args): return subprocess.check_output(['git', *args])
          record = dict(head=git('rev-parse','HEAD').decode().strip(), tree=git('write-tree').decode().strip(),
              status=git('status','--porcelain','--untracked-files=normal').decode(),
              diff_sha256=hashlib.sha256(git('diff','--binary','HEAD','--')).hexdigest(),
              engine_fingerprint=subprocess.check_output(['node','scripts/wasm-source-fingerprint.mjs']).decode().strip())
          assert record['head'] == os.environ['CANDIDATE']
          assert record['tree'] == os.environ['SOURCE_TREE']
          assert record['engine_fingerprint'] == os.environ['ENGINE_FINGERPRINT']
          assert not record['status']
          out = Path(os.environ['RUNNER_TEMP']) / 'math10-wasm-debug-r16'
          out.mkdir()
          (out/'source-before.json').write_text(json.dumps(record,indent=2)+'\n')
      - name: Restore exact branch-scoped diagnostic package without compiling
        id: pkg
        uses: actions/cache/restore@v4
        with:
          path: rhwp/pkg
          key: wasm-pkg-v2-Linux-X64-280d257adbf3e72d7009f449227da7ab80ce310b82115f0ddef228e3648cf0ab
          fail-on-cache-miss: true
      - name: Verify package, source binding and diagnostic provenance
        shell: python3 -u {0}
        env:
          CACHE_HIT: ${{ steps.pkg.outputs.cache-hit }}
          CACHE_KEY: ${{ steps.pkg.outputs.cache-matched-key }}
        run: |
          import hashlib, json, os, shutil, subprocess
          from pathlib import Path
          def git(*args): return subprocess.check_output(['git', *args])
          def sha(path): return hashlib.sha256(path.read_bytes()).hexdigest()
          out = Path(os.environ['RUNNER_TEMP']) / 'math10-wasm-debug-r16'
          before = json.loads((out/'source-before.json').read_text())
          after = dict(head=git('rev-parse','HEAD').decode().strip(), tree=git('write-tree').decode().strip(),
              status=git('status','--porcelain','--untracked-files=normal').decode(),
              diff_sha256=hashlib.sha256(git('diff','--binary','HEAD','--')).hexdigest(),
              engine_fingerprint=subprocess.check_output(['node','scripts/wasm-source-fingerprint.mjs']).decode().strip())
          assert before == after, (before,after)
          assert os.environ['CACHE_HIT'] == 'true'
          pkg = Path('rhwp/pkg')
          required = ['rhwp_bg.wasm','rhwp.js','rhwp.d.ts','rhwp_bg.wasm.d.ts','package.json']
          assert all((pkg/name).is_file() and (pkg/name).stat().st_size > 0 for name in required)
          files = sorted(p for p in pkg.rglob('*') if p.is_file())
          assert not any(p.suffix.lower() in ('.ttf','.otf','.ttc','.hft') for p in files)
          hashes = {p.relative_to(pkg).as_posix(): sha(p) for p in files}
          shutil.copytree(pkg,out/'pkg')
          provenance = dict(schema='math10-wasm-debug-r16', classification='diagnostic fixture failure, not acceptance',
              source_commit=os.environ['CANDIDATE'],source_tree=os.environ['SOURCE_TREE'],
              engine_input_fingerprint=os.environ['ENGINE_FINGERPRINT'],cache_key=os.environ['CACHE_KEY'],
              cache_hit=True,build_performed=False,package_sha256=hashes,
              cache_origin_run=39132801685,cache_origin_job=117691234922,
              prior_fixture_failure='equation-fallback-layout.test.ts:231',
              diagnostic_run_url='https://github.com/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+os.environ['GITHUB_RUN_ID'],
              diagnostic_workflow_commit=os.environ['GITHUB_SHA'],
              limitations=['Branch cache package predates the separate fresh rebuild in r15. Same exact committed engine fingerprint.',
                  'r15 fixture validation failed. This retrieval does not rerun tests and is not acceptance.',
                  'No local compilation, native validation, licensed font upload, document corpus or live Studio check.'],
              source_before=before,source_after=after)
          (out/'source-after.json').write_text(json.dumps(after,indent=2)+'\n')
          (out/'diagnostic.provenance.json').write_text(json.dumps(provenance,indent=2)+'\n')
          (out/'FILES.sha256').write_text(''.join(h+'  pkg/'+p+'\n' for p,h in hashes.items()))
      - uses: actions/upload-artifact@v4
        with:
          name: math10-wasm-debug-r16-diagnostic-only
          path: ${{ runner.temp }}/math10-wasm-debug-r16
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
