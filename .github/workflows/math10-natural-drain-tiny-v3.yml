# SOURCE PREPARATION ONLY. UNBOUND. Root must separately review and bind.
name: tiny Windows 2025 lifecycle v3 source recipe
on:
  push:
    branches:
    - ci/math10-natural-drain-tiny-v3-20261019-r1
permissions:
  contents: read
concurrency:
  group: tiny-lifecycle-v3-${{ github.ref }}
  cancel-in-progress: false
jobs:
  tiny-lifecycle:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
    - name: Exact selected interpreter
      id: py
      uses: actions/setup-python@v5
      with:
        python-version: '3.13.16'
        architecture: x64
        check-latest: false
    - name: Sealed public payload chunk 000
      timeout-minutes: 2
      shell: pwsh
      run: |
        & '${{ steps.py.outputs.python-path }}' -X utf8 -B -c @'
        import sys, struct, os
        if sys.flags.optimize != 0: raise RuntimeError('optimized interpreter is prohibited')
        assert sys.version_info[:3] == (3, 13, 16), 'selected Python mismatch'
        assert sys.implementation.name == 'cpython' and struct.calcsize('P') == 8
        assert sys.flags.utf8_mode == 1 and sys.dont_write_bytecode
        assert os.environ.get('GITHUB_ACTIONS') == 'true' and os.environ.get('ImageOS') == 'win25'
        from pathlib import Path
        import hashlib, json
        identity_dir = Path(os.environ['RUNNER_TEMP']) / 'natural-drain-tiny-evidence'
        identity_dir.mkdir(exist_ok=True)
        identity = dict(executable=sys.executable, executable_sha256=hashlib.sha256(Path(sys.executable).read_bytes()).hexdigest(), version=sys.version, implementation=sys.implementation.name, bits=struct.calcsize('P')*8, optimize=sys.flags.optimize, utf8=sys.flags.utf8_mode, dont_write_bytecode=sys.dont_write_bytecode)
        identity_path = identity_dir / 'selected-interpreter-early.json'
        if identity_path.exists():
            assert json.loads(identity_path.read_bytes()) == identity, 'selected interpreter changed'
        else:
            with identity_path.open('x', encoding='utf-8') as f: json.dump(identity, f, indent=2)
        from pathlib import Path
        import hashlib
        d = Path(os.environ['RUNNER_TEMP']) / 'natural-drain-tiny-evidence'
        d.mkdir(exist_ok=True)
        chunk = ''.encode('ascii')
        assert len(chunk) == 8000 and hashlib.sha256(chunk).hexdigest() == '8103905b91fcdade48a4023717bc847b02bb8f4cbbb75f55b37112b6435e8cca'
        with (d / 'sealed-chunk-000.b64').open('xb') as f: f.write(chunk)
        
        '@
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
