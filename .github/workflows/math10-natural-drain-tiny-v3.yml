        from pathlib import Path
        import base64, hashlib, json
        d = Path(os.environ['RUNNER_TEMP']) / 'natural-drain-tiny-evidence'
        parts = [d / ('sealed-chunk-%03d.b64' % i) for i in range(32)]
        assert all(p.stat().st_size <= 8000 for p in parts)
        encoded = b''.join(p.read_bytes() for p in parts)
        assert len(encoded) == 252540 and len(encoded) < 400000
        raw = base64.b64decode(encoded, validate=True)
        assert len(raw) == 189405 and hashlib.sha256(raw).hexdigest() == '845a4212ff382e4b2462e654a4549b7e13a0b4719193de988930c2fc40c4f949'
        def unique(pairs):
            result = {}
            for key, value in pairs:
                if key in result: raise ValueError('duplicate payload key')
                result[key] = value
            return result
        files = json.loads(raw.decode('utf-8'), object_pairs_hook=unique)
        assert sorted(files) == ['approval_gate.py', 'assess.py', 'assess_minimal.py', 'cases.json', 'diagnostic_support.py', 'fixture.py', 'inputs.json', 'minimal_audit.py', 'owner-candidate.py', 'owner-diagnostic.py', 'receipt.schema.json', 'run_future_ci.py']
        for name, item in files.items():
            assert '/' not in name and '\\' not in name and ':' not in name and not name.startswith('.')
            data = base64.b64decode(item['base64'], validate=True)
            assert len(data) == item['bytes'] and len(data) <= 100000
            assert hashlib.sha256(data).hexdigest() == item['sha256']
            with (d / name).open('xb') as f: f.write(data)
