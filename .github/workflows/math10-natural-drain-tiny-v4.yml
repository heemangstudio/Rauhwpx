# SOURCE PREPARATION ONLY. UNBOUND. Root must separately review and bind.
name: tiny Windows 2025 lifecycle v4 source recipe
on:
  push:
    branches:
    - ci/math10-natural-drain-tiny-v4-20261019-r1
permissions:
  contents: read
concurrency:
  group: tiny-lifecycle-v4-${{ github.ref }}
  cancel-in-progress: false
jobs:
  tiny-lifecycle:
    runs-on: windows-2025-vs2026
    timeout-minutes: 15
    steps:
    - name: Exact selected interpreter
      id: py
      uses: actions/setup-python@v5
      with:
        python-version: '3.13.16'
        architecture: x64
        check-latest: false
    - name: Sealed public payload chunk 000
      timeout-minutes: 2
      shell: pwsh
      run: |
        & '${{ steps.py.outputs.python-path }}' -X utf8 -B -c @'
        """Shared future-CI guard. Preparation exercises only injected identity models."""
        import hashlib
        import json
        import os
        from pathlib import Path
        import struct
        import sys
        
        
        def capture_identity():
            errors = []
            try:
                executable_hash = hashlib.sha256(Path(sys.executable).read_bytes()).hexdigest()
            except Exception as exc:
                executable_hash = None
                errors.append('executable_hash:' + type(exc).__name__)
            build = sys.getwindowsversion().build if os.name == 'nt' else None
            return dict(executable=sys.executable, executable_sha256=executable_hash,
                        version=sys.version, version_info=list(sys.version_info[:3]),
                        implementation=sys.implementation.name, bits=struct.calcsize('P') * 8,
                        optimize=sys.flags.optimize, utf8=sys.flags.utf8_mode,
                        dont_write_bytecode=sys.dont_write_bytecode, os_name=os.name,
                        windows_build=build, capture_errors=errors,
                        environment={k: os.environ.get(k) for k in
                                     ('GITHUB_ACTIONS', 'ImageOS', 'RUNNER_OS', 'ImageVersion')})
        
        
        def identity_errors(value):
            expected = dict(implementation='cpython', version_info=[3, 13, 16], bits=64,
                            optimize=0, utf8=1, dont_write_bytecode=True, os_name='nt')
            errors = [k for k, v in expected.items() if k not in value or value[k] != v]
            env = value.get('environment', {})
            for k, v in dict(GITHUB_ACTIONS='true', ImageOS='win25-vs2026', RUNNER_OS='Windows').items():
                if env.get(k) != v:
                    errors.append(k)
            build = value.get('windows_build')
            if type(build) is not int or build < 26100:
                errors.append('windows_build')
            for k in ('executable', 'version'):
                if not isinstance(value.get(k), str) or not value[k]:
                    errors.append(k)
            h = value.get('executable_sha256')
            if not isinstance(h, str) or len(h) != 64 or any(c not in '0123456789abcdef' for c in h):
                errors.append('executable_sha256')
            if value.get('capture_errors') != []:
                errors.append('capture_errors')
            return errors
        
        
        def require_environment(directory):
            identity = capture_identity()
            # Print before any identity/environment assertion or filesystem operation.
            print('TINY_CI_IDENTITY ' + json.dumps(identity, sort_keys=True), flush=True)
            directory = Path(directory)
            directory.mkdir(exist_ok=True)
            baseline = directory / 'selected-interpreter-early.json'
            errors = identity_errors(identity)
            if baseline.exists():
                if json.loads(baseline.read_bytes()) != identity:
                    errors.append('selected_interpreter_changed')
            else:
                with baseline.open('x', encoding='utf-8') as f:
                    json.dump(identity, f, indent=2)
            with (directory / 'startup-checks.jsonl').open('a', encoding='utf-8') as f:
                f.write(json.dumps(dict(identity=identity, accepted=not errors, errors=errors)) + '\n')
            if errors:
                raise RuntimeError('unsupported CI identity: ' + ','.join(errors))
            return identity
        
        require_environment(Path(os.environ['RUNNER_TEMP']) / 'natural-drain-tiny-evidence')
        from pathlib import Path
        import hashlib
        d = Path(os.environ['RUNNER_TEMP']) / 'natural-drain-tiny-evidence'
        d.mkdir(exist_ok=True)
        chunk = ''.encode('ascii')
        assert len(chunk) == 8000 and hashlib.sha256(chunk).hexdigest() == '8103905b91fcdade48a4023717bc847b02bb8f4cbbb75f55b37112b6435e8cca'
        with (d / 'sealed-chunk-000.b64').open('xb') as f: f.write(chunk)
        
        '@
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
