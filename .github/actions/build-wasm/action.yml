name: Build cached WASM package
description: Reuse the complete release WASM package for unchanged engine inputs.
inputs:
  setup-rust:
    description: Install Rust on a cache miss; set to false when the job already did so.
    default: 'true'
  artifact:
    description: Use a WASM package already built in this run instead of building one.
    default: ''
runs:
  using: composite
  steps:
    - name: Use shared WASM package
      if: inputs.artifact != ''
      uses: actions/download-artifact@v4
      with:
        name: ${{ inputs.artifact }}
        path: rhwp/pkg
    - name: Fingerprint committed engine inputs
      id: source
      if: inputs.artifact == ''
      shell: bash
      run: echo "digest=$(node scripts/wasm-source-fingerprint.mjs)" >> "$GITHUB_OUTPUT"
    - name: Restore complete WASM package
      id: pkg
      if: inputs.artifact == ''
      uses: actions/cache/restore@v4
      with:
        path: rhwp/pkg
        # The digest covers every input that changes rhwp/pkg (scripts/wasm-source-fingerprint.mjs).
        key: wasm-pkg-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.source.outputs.digest }}
    - uses: ./.github/actions/setup-rust
      if: inputs.artifact == '' && inputs.setup-rust == 'true' && steps.pkg.outputs.cache-hit != 'true'
      with:
        wasm: 'true'
        cache: wasm
    - name: Build WASM engine
      if: inputs.artifact == '' && steps.pkg.outputs.cache-hit != 'true'
      shell: bash
      run: npm run build:wasm
    - name: Verify WASM package
      shell: bash
      run: |
        test -s rhwp/pkg/rhwp_bg.wasm
        test -s rhwp/pkg/rhwp.js
        test -s rhwp/pkg/rhwp.d.ts
        test -s rhwp/pkg/rhwp_bg.wasm.d.ts
        test -s rhwp/pkg/package.json
    - name: Save complete WASM package
      if: inputs.artifact == '' && steps.pkg.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: rhwp/pkg
        key: ${{ steps.pkg.outputs.cache-primary-key }}
