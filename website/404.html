/* 픽셀 그림답게 끊어서: 눈물이 볼을 타고 한 칸씩 내려가고, 두 번 흐느껴요 */
.tear { opacity: 0; }
@keyframes tear {
  0%, 30% { opacity: 0; transform: translateY(0); }
  34% { opacity: 1; transform: translateY(0); }
  44% { transform: translateY(1px); }
  54% { opacity: 1; transform: translateY(2px); }
  60%, 100% { opacity: 0; transform: translateY(2px); }
}
@keyframes sob {
  0%, 66%, 72%, 78%, 100% { transform: none; }
  69%, 75% { transform: translateY(1px); }
}
@media (prefers-reduced-motion: no-preference) {
  .tear { animation: tear 3.6s steps(1, end) infinite; }
  .sob { animation: sob 3.6s steps(1, end) infinite; }
}
@media (prefers-reduced-motion: reduce) {
  .tear { opacity: 1; }
}
</style>
