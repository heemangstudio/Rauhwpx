<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'">
  <title>브라우저</title>
  <link rel="stylesheet" href="browser-popout.css">
</head>
<body>
  <header class="browser-chrome">
    <form id="navigation" aria-label="브라우저 탐색">
      <div class="navigation-buttons">
        <button type="button" data-command="back" aria-label="뒤로" title="뒤로" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 6-6 6 6 6"/></svg></button>
        <button type="button" data-command="forward" aria-label="앞으로" title="앞으로" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m10 6 6 6-6 6"/></svg></button>
        <button id="reload" type="button" data-command="reload" aria-label="새로고침" title="새로고침" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><g data-reload><path d="M20 7v5h-5M19.5 12a7.5 7.5 0 1 1-2-5.1L20 9"/></g><g data-stop hidden><rect x="6" y="6" width="12" height="12" rx="2"/></g></svg></button>
      </div>
      <div class="address-field">
        <svg class="address-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M4 12h16M12 4a15 15 0 0 1 0 16 15 15 0 0 1 0-16Z"/></svg>
        <input id="url" aria-label="웹사이트 주소" autocomplete="off" spellcheck="false" readonly>
        <button id="go" type="submit" aria-label="주소로 이동" title="주소로 이동" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m-5-5 5 5-5 5"/></svg></button>
      </div>
      <div class="presentation-buttons">
        <button id="control" type="button" data-command="take-control" aria-label="제어권 가져오기" title="제어권 가져오기" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><g data-control-hand><path d="M8 12V6a2 2 0 0 1 4 0v6M12 8a2 2 0 0 1 4 0v4M16 10a2 2 0 0 1 4 0v5c0 4-3 6-6 6h-1c-3 0-4-2-6-4l-3-4a2 2 0 0 1 3-2l1 1"/></g><g data-control-agent hidden><rect x="5" y="7" width="14" height="13" rx="4"/><path d="M12 7V3m-2 0h4M2 12v4m20-4v4M9 16h6"/><circle cx="9" cy="12" r=".6"/><circle cx="15" cy="12" r=".6"/></g></svg></button>
        <button type="button" data-command="capture" aria-label="페이지 캡처" title="페이지 캡처"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/><rect x="7" y="7" width="10" height="10" rx="2"/></svg></button>
        <button type="button" data-command="dock" aria-label="사이드바에 고정" title="사이드바에 고정"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M15 4v16m-7-8h4m-2-2 2 2-2 2"/></svg></button>
        <button id="close" type="button" aria-label="브라우저 창 닫기" title="브라우저 창 닫기"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg></button>
      </div>
    </form>
    <div id="collaboration">
      <span class="status-dot" aria-hidden="true"></span>
      <span id="status" role="status" aria-live="polite">에이전트 제어</span>
      <div class="secondary-buttons">
        <button type="button" data-command="annotate" aria-label="메모 추가" title="메모 추가"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4H5a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2h13a2 2 0 0 0 2-2v-7M15 4l5 5M9 15l1-5L18 2a2 2 0 0 1 3 3l-8 8-4 2Z"/></svg></button>
        <button type="button" data-command="downloads" aria-label="다운로드 보기" title="다운로드 보기"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m-5-5 5 5 5-5M4 16v4a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-4"/></svg></button>
      </div>
    </div>
  </header>
  <script src="browser-popout.cjs"></script>
</body>
</html>
