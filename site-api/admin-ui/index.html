<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="admin-session" content="__SESSION__">
  <meta name="theme-color" content="#0b0f14">
  <title>라이선스 관리</title>
  <link rel="preload" href="/fonts/galmuri11-bold.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="stage" class="stage">
    <div class="drift">
      <canvas aria-hidden="true"></canvas>
      <div class="column">
        <header class="bar">
          <h1>라이선스</h1>
          <span id="upstream" class="host"></span>
          <button type="button" id="wall-toggle" class="ghost" aria-keyshortcuts="F">전체 화면</button>
        </header>
        <dl class="stats" aria-live="polite">
          <div><dt>테스터</dt><dd id="stat-testers">–</dd></div>
          <div><dt>기기</dt><dd id="stat-devices">–</dd></div>
          <div><dt>최근 24시간</dt><dd id="stat-recent">–</dd></div>
          <div id="stat-attention" class="alert" hidden><dt><span class="lamp alarm"></span>확인할 주문</dt><dd id="stat-attention-count">0</dd></div>
        </dl>
        <ol id="roster" class="roster" aria-label="테스터"></ol>
      </div>
    </div>
  </div>

  <main class="manage">
    <form id="token-form" class="row" hidden>
      <input id="token" type="password" autocomplete="off" placeholder="관리자 토큰" aria-label="관리자 토큰" required>
      <button type="submit" class="primary">키체인에 저장</button>
    </form>

    <div id="attention" class="attention" role="region" aria-labelledby="attention-title" hidden>
      <h2 id="attention-title">확인할 주문</h2>
      <ul id="attention-list"></ul>
      <p id="attention-error" class="error" role="alert"></p>
    </div>

    <section aria-labelledby="feedback-title">
      <h2 id="feedback-title">제보<span id="feedback-new" class="count" hidden></span><span id="feedback-storage" class="muted storage" hidden></span></h2>
      <p id="feedback-error" class="error" role="alert"></p>
      <div id="inbox" class="inbox" hidden>
        <ol id="feedback-list" class="inbox-list" aria-label="제보 목록"></ol>
        <article id="feedback-detail" class="inbox-detail"></article>
      </div>
      <p id="feedback-empty" class="muted" hidden>아직 제보가 없어요.</p>
      <dialog id="shot-dialog" class="shot"><img id="shot-full" alt="스크린샷 원본"></dialog>
    </section>

    <section aria-labelledby="customer-title">
      <h2 id="customer-title">고객</h2>
      <div class="row">
        <form id="issue-form" class="row grow">
          <input id="issue-email" class="grow" type="email" placeholder="이메일" aria-label="이메일" required maxlength="254">
          <button type="submit" class="primary">1년 키 보내기</button>
        </form>
        <input id="customer-filter" class="filter" type="search" placeholder="검색" aria-label="이메일 또는 키로 검색">
      </div>
      <div id="issued" class="created" hidden>
        <span id="issued-email"></span>
        <button type="button" id="issued-key" class="key mono" title="복사"></button>
      </div>
      <p id="customer-error" class="error" role="alert"></p>
      <div class="scroll">
        <table id="customer-table">
          <thead>
            <tr><th></th><th>이메일</th><th>키</th><th>상태</th><th>만료</th><th>기기</th><th>메일</th><th>만든 날</th><th></th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
      <p id="customer-empty" class="muted" hidden>아직 고객이 없어요.</p>
    </section>

    <section aria-labelledby="beta-title">
      <h2 id="beta-title">베타 키</h2>
      <form id="create-form" class="row">
        <input id="name" class="grow" placeholder="이름" aria-label="이름" required maxlength="100">
        <input id="devices" class="narrow" type="number" min="1" max="50" value="5" aria-label="기기 수" title="기기 수">
        <input id="gift" class="narrow" type="number" min="0" max="1000" step="0.01" aria-label="크레딧 (달러)" title="크레딧 (달러)" hidden>
        <input id="note" class="grow" placeholder="메모" aria-label="메모" maxlength="500">
        <button type="submit" class="primary">만들기</button>
      </form>
      <div id="created" class="created" hidden>
        <span id="created-name"></span>
        <button type="button" id="created-key" class="key mono" title="복사"></button>
      </div>
      <p id="beta-error" class="error" role="alert"></p>
      <div class="scroll">
        <table id="beta-table">
          <thead>
            <tr><th></th><th>이름</th><th>키</th><th>상태</th><th>기기</th><th>크레딧</th><th>마지막 사용</th><th>만든 날</th><th></th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
      <p id="beta-empty" class="muted" hidden>아직 베타 키가 없어요.</p>
    </section>

    <section aria-labelledby="lookup-title">
      <h2 id="lookup-title">찾기</h2>
      <form id="lookup-form" class="row">
        <input id="lookup" class="grow mono" placeholder="키 또는 이메일" aria-label="키 또는 이메일" required>
        <button type="submit">찾기</button>
      </form>
      <p id="lookup-error" class="error" role="alert"></p>
      <div class="scroll">
        <table id="lookup-table" hidden>
          <thead>
            <tr><th></th><th>이름</th><th>키</th><th>상태</th><th>기기</th><th>마지막 사용</th><th>만든 날</th><th></th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
  </main>
  <script src="/scene.js"></script>
  <script src="/app.js"></script>
</body>
</html>
